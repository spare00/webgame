<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>네온 벽돌부수기</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px 16px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 8%,#15243a 0,#080d18 48%,#03050a 100%);color:#e7f7ff;font-family:Inter,'Segoe UI',Arial,sans-serif}
    #gameWrap{width:min(960px,96vw);text-align:center}
    header{margin-bottom:18px}
    .eyebrow{margin:0 0 6px;color:#55e8ef;font-size:11px;font-weight:700;letter-spacing:.28em}
    h1{margin:0;color:#f2fbff;font-size:clamp(24px,4vw,36px);letter-spacing:.08em;text-shadow:0 0 24px #00e5ff55}
    .subtitle{margin:7px 0 0;color:#8ba5bd;font-size:13px;letter-spacing:.04em}
    .gameFrame{padding:10px;border:1px solid #274058;border-radius:18px;background:linear-gradient(145deg,#101d2d,#09111e);box-shadow:0 24px 70px #0009,inset 0 1px #ffffff0b}
    canvas{
      display:block;
      width:100%;
      height:auto;
      border:1px solid #295169;
      border-radius:11px;
      background:#050a14;
      box-shadow:0 0 35px #00d9ff12;
      touch-action:none;
    }
    .info{
      display:flex;justify-content:center;gap:10px 24px;flex-wrap:wrap;margin-top:14px;color:#9cb2c8;font-size:12px;
    }
    .info strong{color:#dffaff;font-weight:650}
    @media(max-width:520px){body{padding:16px 8px}.gameFrame{padding:5px;border-radius:13px}.info{gap:8px 14px;font-size:11px}}
  </style>
</head>
<body>
  <div id="gameWrap">
    <header>
      <p class="eyebrow">ARCADE · 01</p>
      <h1>NEON BREAKER</h1>
      <p class="subtitle">벽돌을 깨고, 아이템을 모아 다음 스테이지로</p>
    </header>
    <div class="gameFrame"><canvas id="game" width="640" height="400"></canvas></div>
    <div class="info"><span><strong>← →</strong> 이동</span><span><strong>터치 / 드래그</strong> 패들 조작</span><span><strong>Space</strong> 시작 · 재시작</span></div>
  </div>

  <script>
    'use strict';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    /* =====================
       🔊 SOUND ENGINE
    ===================== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();

    function beep(freq = 440, dur = 0.08, vol = 0.05, type = 'sine') {
      // 브라우저 자동재생 정책 대응: 첫 사용자 입력 이후 resume
      if (audioCtx.state === 'suspended') return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    }

    /* =====================
       🎮 GAME CONSTANTS
    ===================== */
    const BASE_SPEED = 3;
    const BASE_PADDLE_W = Math.round(canvas.width * 0.15); // 화면 비율에 맞춰 패들 기본 너비 확대
    const MAX_PADDLE_W = 150;
    const ITEM_DROP_CHANCE = 0.40;

    const brickCfg = {
      baseRows: 5,
      cols: 8,
      w: Math.round(canvas.width * 0.10),
      h: Math.round(canvas.height * 0.045),
      pad: Math.round(canvas.width * 0.015),
      top: Math.round(canvas.height * 0.14),
      left: Math.round(canvas.width * 0.05)
    };

    /* =====================
       🧠 GAME STATE
    ===================== */
    let running = false;
    let gameOver = false;
    let score = 0;
    let lives = 3;
    let stage = 1;

    // items: expand | multi | speed
    let items = []; // {x, y, type, dead?}

    // balls array
    let balls = []; // {x, y, r, dx, dy, dead?}

    // speed boost timer (frames)
    let speedBoostTimer = 0;

    // high score persistence
    const HS_KEY = 'neon_breaker_highscore';
    let highScore = Number(localStorage.getItem(HS_KEY) || 0);

    // paddle
    const paddle = { w: BASE_PADDLE_W, h: Math.round(canvas.height * 0.03), x: 200, speed: 7 }; // 패들 높이도 화면 비율 반영 // 기본 속도 소폭 증가

    // bricks
    let bricks = []; // {x, y, hp}

    /* =====================
       🧰 HELPERS
    ===================== */
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function resetBallToStart(oneBallSpeed = BASE_SPEED) {
      balls = [{
        x: canvas.width / 2,
        y: canvas.height - 40,
        r: 8,
        dx: oneBallSpeed,
        dy: -oneBallSpeed
      }];
    }

    function initBricksForStage() {
      bricks = [];

      // === Stage-dependent patterns ===
      // 1: full grid, 2: checker, 3: pyramid, 4: diamond, 5+: wave
      const patternType = stage <= 4 ? stage : 5;

      const rows = brickCfg.baseRows + Math.floor((stage - 1) / 2);
      const cols = brickCfg.cols;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let place = true;

          switch (patternType) {
            case 1: // full
              place = true;
              break;
            case 2: // checker
              place = (r + c) % 2 === 0;
              break;
            case 3: // pyramid (중앙이 넓고 아래로 갈수록 넓어지는 느낌)
              place = c >= Math.floor(cols / 2) - r && c <= Math.floor(cols / 2) + r;
              break;
            case 4: { // diamond
              const mid = Math.floor(cols / 2);
              place = Math.abs(c - mid) + Math.abs(r - Math.floor(rows / 2)) <= Math.floor(rows / 2);
              break;
            }
            default: // wave
              place = (r + Math.floor(Math.sin(c / 2) * 2)) % 2 === 0;
          }

          if (!place) continue;

          const baseHp = 1;
          const extraHp = stage >= 3 && Math.random() < 0.30 ? 1 : 0;

          bricks.push({
            x: brickCfg.left + c * (brickCfg.w + brickCfg.pad),
            y: brickCfg.top + r * (brickCfg.h + brickCfg.pad),
            hp: baseHp + extraHp
          });
        }
      }
    }

    function allBricksCleared() {
      return bricks.length > 0 && bricks.every(b => b.hp <= 0);
    }

    function saveHighScoreIfNeeded() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem(HS_KEY, String(highScore));
      }
    }

    /* =====================
       ⌨️ INPUT
    ===================== */
    const keys = {};

    document.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      // 사용자 입력 순간 오디오 활성화
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (e.key === ' ') {
        if (!running) startGame();
      }
    });

    document.addEventListener('keyup', (e) => { keys[e.key] = false; });

    canvas.addEventListener('touchstart', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (!running) startGame();
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      const r = canvas.getBoundingClientRect();
      const x = (e.touches[0].clientX - r.left) * canvas.width / r.width;
      paddle.x = x - paddle.w / 2;
    }, { passive: true });

    /* =====================
       🚀 GAME FLOW
    ===================== */
    function startGame() {
      running = true;
      gameOver = false;
      score = 0;
      lives = 3;
      stage = 1;
      items = [];
      speedBoostTimer = 0;

      paddle.w = BASE_PADDLE_W;
      paddle.x = (canvas.width - paddle.w) / 2;

      resetBallToStart(BASE_SPEED);
      initBricksForStage();
    }

    function nextStage() {
      stage++;
      items = [];
      speedBoostTimer = 0;

      // ✅ 공 기본 속도 소폭 상승
      const s = BASE_SPEED + (stage - 1) * 0.30;
      resetBallToStart(s);

      // 난이도 보정: 패들 확장 아이템을 먹었을 수 있으니 기본으로 복귀
      paddle.w = BASE_PADDLE_W;
      paddle.x = (canvas.width - paddle.w) / 2;

      initBricksForStage();
      beep(1500, 0.25, 0.08, 'triangle');
      beep(900, 0.15, 0.06, 'sine');
    }

    /* =====================
       💥 COLLISION
    ===================== */
    function hitBricks(ball) {
      for (const b of bricks) {
        if (b.hp <= 0) continue;
        if (
          ball.x > b.x &&
          ball.x < b.x + brickCfg.w &&
          ball.y > b.y &&
          ball.y < b.y + brickCfg.h
        ) {
          ball.dy *= -1;
          b.hp -= 1;
          score += 1;
          beep(700, 0.05, 0.05, 'square');

          if (b.hp <= 0 && Math.random() < ITEM_DROP_CHANCE) {
            // 공 분열 + 스피드업 + 확장
            const types = ['expand', 'multi', 'speed'];
            const type = types[Math.floor(Math.random() * types.length)];
            items.push({ x: b.x + brickCfg.w / 2, y: b.y, type });
          }
          return; // 한 프레임에 다중 충돌 방지
        }
      }
    }

    function updateItems() {
      for (const it of items) {
        it.y += 2;
        // 패들에 닿으면 획득
        if (
          it.y > canvas.height - paddle.h &&
          it.x > paddle.x &&
          it.x < paddle.x + paddle.w
        ) {
          if (it.type === 'expand') {
            paddle.w = Math.min(MAX_PADDLE_W, paddle.w + 30);
            beep(300, 0.12, 0.06, 'sine');
          } else if (it.type === 'multi') {
            // 현재 공들 각각을 1개씩 더 복제 (대칭 방향)
            const clones = [];
            for (const b of balls) {
              clones.push({ x: b.x, y: b.y, r: b.r, dx: -b.dx, dy: b.dy });
            }
            balls = balls.concat(clones);
            beep(900, 0.12, 0.06, 'triangle');
          } else if (it.type === 'speed') {
            // 약 10초 (60fps 기준)
            speedBoostTimer = 60 * 10;
            beep(1200, 0.10, 0.06, 'sawtooth');
          }
          it.dead = true;
        }
        // 화면 밖으로 나가면 제거
        if (it.y > canvas.height + 20) it.dead = true;
      }
      items = items.filter(i => !i.dead);
    }

    /* =====================
       🔄 UPDATE
    ===================== */
    function update() {
      if (!running) return;

      // paddle move
      if (keys['ArrowLeft']) paddle.x -= paddle.speed;
      if (keys['ArrowRight']) paddle.x += paddle.speed;
      paddle.x = clamp(paddle.x, 0, canvas.width - paddle.w);

      // speed boost
      if (speedBoostTimer > 0) speedBoostTimer--;
      const speedMul = speedBoostTimer > 0 ? 1.60 : 1.0;

      // balls update
      for (const ball of balls) {
        const previousX = ball.x;
        const previousY = ball.y;
        ball.x += ball.dx * speedMul;
        ball.y += ball.dy * speedMul;

        // walls
        if (ball.x < ball.r || ball.x > canvas.width - ball.r) ball.dx *= -1;
        if (ball.y < ball.r) ball.dy *= -1;

        // Circle vs paddle rectangle, resolving the side that was hit.
        const paddleTop = canvas.height - paddle.h;
        const closestX = clamp(ball.x, paddle.x, paddle.x + paddle.w);
        const closestY = clamp(ball.y, paddleTop, canvas.height);
        const overlapX = ball.x - closestX;
        const overlapY = ball.y - closestY;
        if (overlapX * overlapX + overlapY * overlapY <= ball.r * ball.r) {
          if (previousY + ball.r <= paddleTop && ball.dy > 0) {
            ball.y = paddleTop - ball.r;
            ball.dy = -Math.abs(ball.dy);
            const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
            ball.dx = clamp(ball.dx + hit * 0.5, -6, 6);
          } else if (previousX < paddle.x && ball.dx > 0) {
            ball.x = paddle.x - ball.r;
            ball.dx = -Math.abs(ball.dx);
          } else if (previousX > paddle.x + paddle.w && ball.dx < 0) {
            ball.x = paddle.x + paddle.w + ball.r;
            ball.dx = Math.abs(ball.dx);
          } else {
            ball.y = paddleTop - ball.r;
            ball.dy = -Math.abs(ball.dy);
          }
          beep(500, 0.04, 0.05, 'square');
        }

        // bottom
        if (ball.y > canvas.height + 20) ball.dead = true;

        hitBricks(ball);
      }

      balls = balls.filter(b => !b.dead);

      // lose a life when all balls are gone
      if (balls.length === 0) {
        lives -= 1;
        beep(120, 0.20, 0.06, 'sine');

        if (lives <= 0) {
          running = false;
          gameOver = true;
          saveHighScoreIfNeeded();
          return;
        }
        // respawn single ball
        const s = BASE_SPEED + (stage - 1) * 0.30;
        resetBallToStart(s);
      }

      updateItems();

      // stage clear
      if (allBricksCleared()) {
        nextStage();
      }
    }

    /* =====================
       🎨 DRAW (NEON)
    ===================== */
    function drawNeonRect(x, y, w, h, color, blur = 12) {
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = blur;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, Math.min(5, h / 2));
      ctx.fill();
      ctx.restore();
    }

    function drawBackground() {
      const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bg.addColorStop(0, '#0c1727');
      bg.addColorStop(0.55, '#07101c');
      bg.addColorStop(1, '#050913');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.strokeStyle = 'rgba(100,180,220,.055)';
      ctx.lineWidth = 1;
      for (let y = 54; y < canvas.height; y += 32) {
        ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(canvas.width, y + .5); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(150,220,255,.16)';
      for (let x = 18; x < canvas.width; x += 43) {
        for (let y = 57; y < canvas.height; y += 32) ctx.fillRect(x, y, 1, 1);
      }
      ctx.restore();
    }

    function drawBrick(b) {
      const x = b.x, y = b.y, w = brickCfg.w, h = brickCfg.h;
      const top = b.hp >= 2 ? '#ffc05d' : '#ff718e';
      const bottom = b.hp >= 2 ? '#e26a27' : '#d93365';
      const gradient = ctx.createLinearGradient(x, y, x, y + h);
      gradient.addColorStop(0, top);
      gradient.addColorStop(1, bottom);
      ctx.save();
      ctx.shadowColor = bottom;
      ctx.shadowBlur = 9;
      ctx.fillStyle = gradient;
      ctx.beginPath(); ctx.roundRect(x, y, w, h, 5); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,.24)';
      ctx.beginPath(); ctx.roundRect(x + 3, y + 2, w - 6, 2, 1); ctx.fill();
      if (b.hp >= 2) {
        ctx.strokeStyle = 'rgba(255,246,204,.72)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(x + 3, y + 3, w - 6, h - 6, 3); ctx.stroke();
      }
      ctx.restore();
    }

    function draw() {
      drawBackground();

      // balls
      for (const b of balls) {
        ctx.save();
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        const ballGlow = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, b.r + 2);
        ballGlow.addColorStop(0, '#ffffff');
        ballGlow.addColorStop(.35, '#a9ffff');
        ballGlow.addColorStop(1, '#00a9c8');
        ctx.fillStyle = ballGlow;
        ctx.fill();
        ctx.restore();
      }

      // paddle
      const paddleY = canvas.height - paddle.h;
      const paddleGradient = ctx.createLinearGradient(0, paddleY, 0, paddleY + paddle.h);
      paddleGradient.addColorStop(0, '#f2ffff');
      paddleGradient.addColorStop(.35, '#57eaff');
      paddleGradient.addColorStop(1, '#1486b5');
      ctx.save();
      ctx.shadowColor = '#31deff'; ctx.shadowBlur = 16;
      ctx.fillStyle = paddleGradient;
      ctx.beginPath(); ctx.roundRect(paddle.x, paddleY, paddle.w, paddle.h, 7); ctx.fill();
      ctx.restore();

      // bricks
      for (const b of bricks) {
        if (b.hp <= 0) continue;
        drawBrick(b);
      }

      // items
      for (const it of items) {
        const c = it.type === 'expand' ? '#00ff99' : it.type === 'multi' ? '#29b6f6' : '#e040fb';
        drawNeonRect(it.x - 7, it.y, 14, 14, c, 13);
        ctx.fillStyle = '#06111b';
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(it.type === 'expand' ? 'W' : it.type === 'multi' ? '+' : '»', it.x, it.y + 10);
      }

      // HUD
      ctx.save();
      ctx.fillStyle = 'rgba(5,12,22,.88)';
      ctx.fillRect(0, 0, canvas.width, 43);
      ctx.strokeStyle = 'rgba(95,218,244,.18)';
      ctx.beginPath(); ctx.moveTo(0, 43.5); ctx.lineTo(canvas.width, 43.5); ctx.stroke();
      ctx.fillStyle = '#bdfaff';
      ctx.font = 'bold 13px Arial';
      ctx.shadowColor = '#0ff';
      ctx.shadowBlur = 5;
      ctx.fillText(`SCORE  ${score}`, 16, 19);
      ctx.fillText(`LIFE  ${lives}`, 16, 36);
      ctx.textAlign = 'center';
      ctx.fillText(`STAGE  ${stage}`, canvas.width / 2, 27);
      ctx.textAlign = 'right';
      ctx.fillText(`BEST  ${highScore}`, canvas.width - 16, 19);
      if (speedBoostTimer > 0) ctx.fillText('SPEED UP', canvas.width - 16, 36);
      ctx.textAlign = 'left';
      ctx.restore();

      if (!running) {
        // high score update (in case user refreshed mid-run and stopped)
        saveHighScoreIfNeeded();
        ctx.save();
        ctx.fillStyle = 'rgba(2,7,15,.76)';
        ctx.fillRect(0, 43, canvas.width, canvas.height - 43);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f1fcff';
        ctx.font = 'bold 25px Arial';
        ctx.shadowColor = '#00d9ff';
        ctx.shadowBlur = 16;
        ctx.fillText(gameOver ? 'GAME OVER' : 'READY?', canvas.width / 2, 176);
        ctx.font = '15px Arial';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#77f4ff';
        ctx.fillText('SPACE / 터치로 시작', canvas.width / 2, 210);
        ctx.font = '12px Arial';
        ctx.fillStyle = '#a6bbce';
        ctx.fillText(`HIGH SCORE  ${highScore}`, canvas.width / 2, 237);
        ctx.textAlign = 'left';
        ctx.restore();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    /* =====================
       ✅ LIGHT TESTS (CONSOLE)
       - 게임은 브라우저에서 돌아가므로,
         최소한의 로직 테스트만 넣었습니다.
    ===================== */
    function runSelfTests() {
      const assert = (cond, msg) => { if (!cond) throw new Error('TEST FAIL: ' + msg); };

      assert(clamp(5, 0, 10) === 5, 'clamp within');
      assert(clamp(-1, 0, 10) === 0, 'clamp low');
      assert(clamp(999, 0, 10) === 10, 'clamp high');

      bricks = [{hp:0},{hp:-1}];
      assert(allBricksCleared() === true, 'allBricksCleared true');

      bricks = [{hp:0},{hp:1}];
      assert(allBricksCleared() === false, 'allBricksCleared false');

      // ✅ stage patterns should create some bricks
      const prevStage = stage;
      for (const s of [1, 2, 3, 4, 5, 6]) {
        stage = s;
        initBricksForStage();
        assert(bricks.length > 0, `bricks initialized at stage ${s}`);
      }
      stage = prevStage;

      // ✅ nextStage should increase speed slightly
      stage = 1;
      resetBallToStart(BASE_SPEED);
      const before = Math.hypot(balls[0].dx, balls[0].dy);
      nextStage();
      const after = Math.hypot(balls[0].dx, balls[0].dy);
      assert(after > before, 'ball base speed increases after stage up');

      console.log('[OK] Self tests passed');
    }

    // Initial state
    runSelfTests();
    initBricksForStage();
    resetBallToStart(BASE_SPEED);
    loop();
  </script>
</body>
</html>
