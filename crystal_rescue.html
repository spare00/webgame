<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08131f" />
  <title>크리스털 구조대 · 2인 협동</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0,#173a50,#0a1824 58%,#071018);color:#eff8ff;font-family:system-ui,sans-serif}main{width:min(100%,940px);text-align:center}.top{display:flex;align-items:center;justify-content:space-between;margin:0 auto 14px;max-width:900px}.brand{text-align:left}.brand h1{margin:0;font-size:clamp(22px,4vw,32px);letter-spacing:-.04em}.brand p{margin:4px 0 0;color:#91adbd;font-size:12px}a{color:#9de8ff;text-decoration:none;font-size:13px}.game{overflow:hidden;border:1px solid #8bdff638;border-radius:18px;background:#08131f;box-shadow:0 24px 80px #0009}.game canvas{display:block;width:100%;height:auto;touch-action:none}.help{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px;margin:13px 0 0;color:#96aebb;font-size:12px}.help b{color:#edfbff}.mobile{display:none;margin:14px auto 0;grid-template-columns:1fr 1fr;gap:14px}.pad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(2,38px);gap:5px;justify-content:center}.pad button{height:38px;border:1px solid #ffffff28;border-radius:9px;background:#122434;color:#eafaff;font-weight:700;touch-action:none}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.pad button:active{background:#1e5261}.player-controls{display:flex;align-items:center;justify-content:center;gap:8px}.player-controls label{font-size:10px;color:#b0c6d0}.p1 label{color:#81f0e0}.p2 label{color:#8fc4ff}@media(max-width:600px){body{padding:12px 8px}.help{gap:6px 10px;font-size:10px}.mobile{display:grid}}
  </style>
</head>
<body>
  <main>
    <header class="top"><div class="brand"><h1>💠 크리스털 구조대</h1><p>둘이 힘을 모아 18개의 크리스털을 되찾으세요!</p></div><a href="./index.html">← 게임 목록</a></header>
    <div class="game" id="game"></div>
    <div class="mobile"><div class="player-controls p1"><label>P1</label><div class="pad"><button data-player="1" data-dir="up">▲</button><button data-player="1" data-dir="left">◀</button><button data-player="1" data-dir="down">▼</button><button data-player="1" data-dir="right">▶</button></div></div><div class="player-controls p2"><label>P2</label><div class="pad"><button data-player="2" data-dir="up">▲</button><button data-player="2" data-dir="left">◀</button><button data-player="2" data-dir="down">▼</button><button data-player="2" data-dir="right">▶</button></div></div></div>
    <p class="help"><span><b>P1</b> WASD 이동</span><span><b>P2</b> 방향키 이동</span><span><b>M</b> 효과음 켜기/끄기</span><span><b>R</b> 다시 시작</span></p>
  </main>
  <script type="module" src="/src/crystalRescue.ts"></script>
</body>
</html>
