<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#061a2b" />
  <title>딥 씨 샐비지</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0,#164c68,#09243a 58%,#06121e);color:#eafaff;font-family:system-ui,sans-serif}main{width:min(100%,940px);text-align:center}.top{display:flex;align-items:center;justify-content:space-between;margin:0 auto 14px;max-width:900px}.brand{text-align:left}.brand h1{margin:0;font-size:clamp(22px,4vw,32px);letter-spacing:-.04em}.brand p{margin:4px 0 0;color:#92b9ca;font-size:12px}a{color:#8be6f0;text-decoration:none;font-size:13px}.game{overflow:hidden;border:1px solid #7ddded40;border-radius:18px;background:#061a2b;box-shadow:0 24px 80px #0009}.game canvas{display:block;width:100%;height:auto;touch-action:none}.help{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px;margin:13px 0 0;color:#96b7c4;font-size:12px}.help b{color:#effdff}.mobile{display:none;margin:14px auto 0;width:max-content}.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,38px);gap:5px}.pad button{height:38px;border:1px solid #ffffff2a;border-radius:9px;background:#102b40;color:#e9fbff;font-weight:700;touch-action:none}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.pad button:active{background:#1b5363}@media(max-width:600px){body{padding:12px 8px}.help{gap:6px 10px;font-size:10px}.mobile{display:block}}
  </style>
</head>
<body>
  <main>
    <header class="top"><div class="brand"><h1>🤿 딥 씨 샐비지</h1><p>심해의 진주를 모아 무사히 귀환하세요</p></div><a href="./index.html">← 게임 목록</a></header>
    <div class="game" id="game"></div>
    <div class="mobile"><div class="pad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div>
    <p class="help"><span><b>W A S D / 방향키</b> 잠수함 조종</span><span><b>M</b> 효과음 켜기/끄기</span></p>
  </main>
  <script type="module" src="/src/deepSea.ts"></script>
</body>
</html>
