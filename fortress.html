<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortress</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #080d18; color: #e8efff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      main { width: min(100%, 1040px); text-align: center; }
      h1 { margin: 0 0 5px; color: #f4f7ff; font-size: clamp(20px, 4vw, 30px); letter-spacing: .16em; }
      .subtitle { margin: 0 0 18px; color: #7f91b4; font-size: 12px; letter-spacing: .12em; }
      #game { width: 100%; }
      #game canvas { display: block; width: 100%; height: auto; border: 1px solid #26334d; border-radius: 12px; box-shadow: 0 18px 60px #0009; }
      #controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 22px; margin: 14px 0 0; color: #98a8c8; font-size: 12px; line-height: 1.7; }
      #controls strong { color: #dce6ff; }
      @media (max-width: 600px) { body { padding: 12px 6px; } #controls { gap: 4px 10px; font-size: 10px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>FORTRESS</h1>
      <p class="subtitle">TWO PLAYER ARTILLERY · TAKE TURNS · HOLD THE FORT</p>
      <div id="game"></div>
      <p id="controls"><span><strong>↑ / ↓</strong> angle</span><span><strong>← / →</strong> power</span><span><strong>A / D</strong> move</span><span><strong>SPACE</strong> fire</span><span><strong>R</strong> restart</span></p>
    </main>
    <script type="module" src="/src/fortress.ts"></script>
  </body>
</html>
