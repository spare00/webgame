<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Galaga (Web)</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #0f0;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 2px solid #0f0;
      background: #000;
      image-rendering: pixelated;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="640"></canvas>

  <script>
    'use strict';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const stars = Array.from({ length: 110 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: 0.5 + Math.random() * 1.4,
      speed: 14 + Math.random() * 72,
      phase: Math.random() * Math.PI * 2
    }));

    // Toggle for running in-browser tests (disabled by default so gameplay isn't affected)
    const RUN_TESTS = false;

    // =====================
    // Game State
    // =====================
    let score = 0;
    let lives = 3;
    let stage = 1;
    let gameOver = false;
    let started = false;

    // localStorage key: galaga_highscore
    let highScore = Number(localStorage.getItem('galaga_highscore') || 0);

    // High-score blink effect state
    let hiBlinkTimer = 0; // frames remaining to blink when updated
    let hiSoundPlayed = false; // prevent repeated sound during blink

    // =====================
    // Player
    // =====================
    const player = {
      x: canvas.width / 2 - 15,
      y: canvas.height - 60,
      w: 30,
      h: 20,
      speed: 5,
      invincible: 0,
      captured: false,
      double: false
    };

    // =====================
    // Entities
    // =====================
    let bullets = [];
    let enemyBullets = [];
    let explosions = [];
    let lifeItems = [];

    // Boss attacks
    let bossLasers = []; // damaging long lasers (move like bullets)

    let enemies = [];
    const enemyRows = 4;
    const enemyCols = 6;

    // Internal flag for tests
    let __TESTING = false;

    // =====================
    // Sound (WebAudio)
    // =====================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();

    function beep(freq, duration = 0.08) {
      if (__TESTING) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.value = 0.05;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // =====================
    // Init / Reset
    // =====================
    function initEnemies() {
      enemies = [];

      // Regular enemies
      for (let r = 0; r < enemyRows; r++) {
        for (let c = 0; c < enemyCols; c++) {
          const baseX = 60 + c * 60;
          const baseY = 90 + r * 50;
          enemies.push({
            type: 'normal',
            x: baseX,
            y: baseY,
            baseX,
            baseY,
            w: 30,
            h: 20,
            alive: true,
            state: 'formation',
            angle: 0,
            speed: 2 + stage * 0.3
          });
        }
      }

      // Boss Galaga (appears every 3 stages)
      if (stage % 3 === 0) {
        enemies.push({
          type: 'boss',
          x: canvas.width / 2 - 30,
          y: 40,
          baseX: canvas.width / 2 - 30,
          baseY: 40,
          w: 60,
          h: 30,
          alive: true,
          hp: 8,
          hitFlash: 0,
          state: 'formation',
          angle: 0,
          speed: 1.5 + stage * 0.2
        });
      }
    }

    function resetGame() {
      score = 0;
      lives = 3;
      stage = 1;
      gameOver = false;

      bullets = [];
      enemyBullets = [];
      explosions = [];
      lifeItems = [];
      bossLasers = [];

      player.captured = false;
      player.double = false;

      // In real gameplay we want a brief invincibility after restart.
      // For deterministic unit tests, the suite expects immediate vulnerability.
      player.invincible = __TESTING ? 0 : 60;

      initEnemies();
    }

    initEnemies();

    // =====================
    // Input (Keyboard + simple mobile)
    // =====================
    const keys = {};

    document.addEventListener('keydown', (e) => {
      keys[e.key] = true;

      if (!started && e.key === ' ') started = true;
      if (gameOver && e.key === ' ') {
        resetGame();
        started = true;
      }

      if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
    }, { passive: false });

    document.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // Mobile: touch left/right to move, tap top area to shoot
    canvas.addEventListener('touchstart', (e) => {
      if (!e.touches || !e.touches[0]) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.touches[0].clientX - rect.left;
      const y = e.touches[0].clientY - rect.top;

      if (!started) started = true;
      if (gameOver) {
        resetGame();
        started = true;
      }

      if (y < canvas.height * 0.35) {
        keys[' '] = true;
      } else {
        if (x < canvas.width / 2) keys['ArrowLeft'] = true;
        else keys['ArrowRight'] = true;
      }
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      keys['ArrowLeft'] = false;
      keys['ArrowRight'] = false;
      keys[' '] = false;
    });

    // =====================
    // Helpers
    // =====================
    function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function formationX(e, t) {
      // In tests we keep formation static for deterministic collisions.
      if (__TESTING) return e.baseX;

      // Boss moves wider horizontally (2x range)
      const amp = e.type === 'boss' ? 20 : 10;
      return e.baseX + Math.sin(t / 500 + e.baseY) * amp;
    }

    // =====================
    // Shooting
    // =====================
    function shoot() {
      // (Double-fighter disabled for now)
      bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 8, dead: false });
      beep(800);
    }

    function enemyShoot(e) {
      enemyBullets.push({ x: e.x + e.w / 2 - 2, y: e.y + e.h, w: 4, h: 8, dead: false });
      beep(300);
    }

    function explode(x, y, isBoss = false) {
      explosions.push({ x, y, life: 20 });

      if (isBoss) {
        // Boss kill sound: lower, heavier
        beep(180, 0.4);
        setTimeout(() => beep(120, 0.4), 120);
      } else {
        beep(500, 0.1);
      }
    }

    function maybeDropLife(x, y) {
      if (lifeItems.length === 0 && Math.random() < 0.04) {
        lifeItems.push({ x, y, w: 20, h: 20, phase: Math.random() * Math.PI * 2 });
      }
    }

    // =====================
    // Boss Attacks
    // =====================
    function fireBossLaser(boss) {
      // Laser pattern upgrades by stage
      // stage < 10 : single straight laser
      // stage >=10 : two spreading lasers (/ \\)
      // stage >=20 : three-way missiles (/ | \\)

      const baseX = boss.x + boss.w / 2 - 6;
      const baseY = boss.y + boss.h;

      function spawnLaser(dx) {
        bossLasers.push({
          x: baseX,
          y: baseY,
          w: 12,
          h: 80,
          speed: 6,
          dx,          // horizontal drift
          active: true,
          boss
        });
      }

      if (stage >= 20) {
        spawnLaser(-2.5);
        spawnLaser(0);
        spawnLaser(2.5);
      } else if (stage >= 10) {
        spawnLaser(-2.5);
        spawnLaser(2.5);
      } else {
        spawnLaser(0);
      }

      beep(260, 0.06);
    }

    let lastShot = 0;

    // =====================
    // Update
    // =====================
    function update(time) {
      // Helper: respawn player after taking damage (prevents "ship disappears" bug)
      function respawnPlayer() {
        player.x = canvas.width / 2 - player.w / 2;
        player.y = canvas.height - 60;
        player.captured = false;
      }

      if (!started || gameOver) return;

      if (player.invincible > 0) player.invincible--;

      // Player movement
      if (!player.captured) {
        if (keys['ArrowLeft']) player.x -= player.speed;
        if (keys['ArrowRight']) player.x += player.speed;
        player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

        if (keys[' '] && time - lastShot > 220) {
          shoot();
          lastShot = time;
        }
      }

      // Enemy dive trigger
      if (!__TESTING && Math.random() < 0.01 + stage * 0.002) {
        const cand = enemies.filter(en => en.alive && en.state === 'formation' && en.type !== 'boss');
        if (cand.length) {
          const en = cand[(Math.random() * cand.length) | 0];
          en.state = 'dive';
          en.angle = 0;
        }
      }

      // Enemies
      for (const en of enemies) {
        // Boss attacks (live only)
        if (!__TESTING && en.type === 'boss' && en.alive) {
          if (Math.random() < 0.004 + stage * 0.001) fireBossLaser(en);
        }

        if (!en.alive) continue;

        if (en.type === 'boss' && en.hitFlash > 0) en.hitFlash--;

        if (en.state === 'formation') {
          en.x = formationX(en, time);
          en.y = en.baseY;
        } else {
          en.angle += 0.05;
          en.y += en.speed * 2;
          en.x += Math.sin(en.angle) * 5;

          if (!__TESTING && Math.random() < 0.02 + stage * 0.003) enemyShoot(en);

          // Player collision with enemy body
          if (player.invincible === 0 && aabb(player.x, player.y, player.w, player.h, en.x, en.y, en.w, en.h)) {
            lives--;
            if (lives <= 0) gameOver = true;
            player.invincible = 60;
            explode(player.x + player.w / 2, player.y + player.h / 2);
            respawnPlayer();
          }

          if (en.y > canvas.height + 30) {
            en.y = en.baseY;
            en.x = en.baseX;
            en.state = 'formation';
          }
        }
      }

      // Player bullets
      for (const b of bullets) b.y -= 7;
      for (const b of bullets) {
        if (b.dead) continue;
        for (const en of enemies) {
          if (!en.alive) continue;
          if (aabb(b.x, b.y, b.w, b.h, en.x, en.y, en.w, en.h)) {
            b.dead = true;

            if (en.type === 'boss') {
              en.hp -= 1;
              en.hitFlash = 10;

              if (en.hp <= 0) {
                en.alive = false;
                score += 400;
                maybeDropLife(en.x + en.w / 2, en.y + en.h / 2);

                // Remove any active lasers owned by this boss
                bossLasers.forEach(l => { if (l.boss === en) l.active = false; });
                bossLasers = bossLasers.filter(l => l.active);

                explode(en.x + en.w / 2, en.y + en.h / 2, true);
              } else {
                score += 200;
                explode(en.x + en.w / 2, en.y + en.h / 2);
              }
            } else {
              en.alive = false;
              score += 100;
              maybeDropLife(en.x + en.w / 2, en.y + en.h / 2);
              explode(en.x + en.w / 2, en.y + en.h / 2);
            }

            break;
          }
        }
      }
      bullets = bullets.filter(b => !b.dead && b.y > 0);

      // Boss lasers update + collision (damaging long projectiles)
      for (const laser of bossLasers) {
        if (!laser.active) continue;

        laser.y += laser.speed;
        laser.x += laser.dx || 0;

        if (player.invincible === 0 && aabb(player.x, player.y, player.w, player.h, laser.x, laser.y, laser.w, laser.h)) {
          laser.active = false;
          lives--;
          if (lives <= 0) gameOver = true;
          player.invincible = 60;
          explode(player.x + player.w / 2, player.y + player.h / 2);
          respawnPlayer();
        }

        if (laser.y > canvas.height || laser.x < -40 || laser.x > canvas.width + 40) laser.active = false;
      }
      bossLasers = bossLasers.filter(l => l.active);

      // Enemy bullets
      for (const eb of enemyBullets) eb.y += 5;
      for (const eb of enemyBullets) {
        if (eb.dead) continue;
        if (player.invincible === 0 && aabb(player.x, player.y, player.w, player.h, eb.x, eb.y, eb.w, eb.h)) {
          eb.dead = true;
          lives--;
          if (lives <= 0) gameOver = true;
          player.invincible = 60;
          explode(player.x + player.w / 2, player.y + player.h / 2);
          respawnPlayer();
        }
      }
      enemyBullets = enemyBullets.filter(b => !b.dead && b.y < canvas.height);

      for (const item of lifeItems) {
        item.y += 2.2;
        item.phase += 0.08;
        if (aabb(player.x, player.y, player.w, player.h, item.x - item.w / 2, item.y - item.h / 2, item.w, item.h)) {
          lives++;
          item.collected = true;
          beep(980, 0.16);
        }
      }
      lifeItems = lifeItems.filter(item => !item.collected && item.y < canvas.height + item.h);

      // Explosions
      explosions.forEach(ex => ex.life--);
      explosions = explosions.filter(ex => ex.life > 0);

      // Stage clear
      if (enemies.every(en => !en.alive)) {
        stage++;
        initEnemies();
      }

      // High score update
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('galaga_highscore', String(highScore));
        hiBlinkTimer = 120; // ~2 seconds at 60fps
        hiSoundPlayed = false;
      }
    }

    // =====================
    // Draw
    // =====================
    function drawPlayer(x, y, blink) {
      if (blink && player.invincible % 10 >= 5) return;
      const cx = x + player.w / 2;
      const flame = 4 + Math.sin(performance.now() / 55) * 2;
      ctx.save();
      ctx.shadowColor = '#24f4ff';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffbd58';
      ctx.beginPath();
      ctx.moveTo(cx - 5, y + 15);
      ctx.lineTo(cx, y + 20 + flame);
      ctx.lineTo(cx + 5, y + 15);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#18c7c7';
      ctx.strokeStyle = '#b8ffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx, y);
      ctx.lineTo(x + 28, y + 17);
      ctx.lineTo(x + 22, y + 17);
      ctx.lineTo(cx + 5, y + 13);
      ctx.lineTo(cx + 4, y + 18);
      ctx.lineTo(cx - 4, y + 18);
      ctx.lineTo(cx - 5, y + 13);
      ctx.lineTo(x + 8, y + 17);
      ctx.lineTo(x + 2, y + 17);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#eaffff';
      ctx.beginPath();
      ctx.moveTo(cx, y + 4);
      ctx.lineTo(cx + 3, y + 12);
      ctx.lineTo(cx, y + 14);
      ctx.lineTo(cx - 3, y + 12);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawStarfield(time) {
      ctx.fillStyle = '#030817';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const seconds = time / 1000;
      for (const star of stars) {
        const y = (star.y + seconds * star.speed) % canvas.height;
        const twinkle = 0.45 + (Math.sin(seconds * 2 + star.phase) + 1) * 0.25;
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = star.speed > 62 ? '#9cecff' : '#dceaff';
        if (star.speed > 62) {
          const streak = 2 + star.speed * 0.055;
          ctx.fillRect(star.x, y - streak, star.size, streak);
        } else {
          ctx.fillRect(star.x, y, star.size, star.size);
        }
      }
      ctx.globalAlpha = 1;
    }

    function drawEnemy(en, time) {
      const pulse = (Math.floor(time / 140) % 2) === 0;

      if (en.type === 'boss') {
        const x = en.x, y = en.y, cx = x + en.w / 2;
        const hull = en.hitFlash > 0 ? '#ff737c' : '#a34cff';
        ctx.save();
        ctx.shadowColor = '#bb52ff';
        ctx.shadowBlur = 14;
        ctx.fillStyle = hull;
        ctx.strokeStyle = en.hitFlash > 0 ? '#fff0f0' : '#e0b5ff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx, y + 3);
        ctx.lineTo(cx + 9, y + 8);
        ctx.lineTo(x + en.w - 2, y + 4);
        ctx.lineTo(x + en.w - 8, y + 18);
        ctx.lineTo(x + en.w - 1, y + 23);
        ctx.lineTo(cx + 13, y + 25);
        ctx.lineTo(cx + 7, y + en.h - 1);
        ctx.lineTo(cx, y + 25);
        ctx.lineTo(cx - 7, y + en.h - 1);
        ctx.lineTo(cx - 13, y + 25);
        ctx.lineTo(x + 1, y + 23);
        ctx.lineTo(x + 8, y + 18);
        ctx.lineTo(x + 2, y + 4);
        ctx.lineTo(cx - 9, y + 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#32164f';
        ctx.beginPath();
        ctx.ellipse(cx, y + 15, 18, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = pulse ? '#8cffff' : '#28d9ff';
        ctx.shadowColor = '#28d9ff';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.ellipse(cx, y + 15, 7, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffda72';
        ctx.fillRect(x + 7, y + 19, 4, 2);
        ctx.fillRect(x + en.w - 11, y + 19, 4, 2);
        ctx.restore();

        // HP indicator
        ctx.fillStyle = '#e7ffff';
        for (let i = 0; i < Math.max(0, en.hp); i++) {
          ctx.fillRect(en.x + 4 + i * 8, en.y - 6, 6, 4);
        }
        return;
      }

      const x = en.x, y = en.y, cx = x + en.w / 2;
      const armor = pulse ? '#ff643f' : '#e94b37';
      ctx.save();
      ctx.shadowColor = '#ff553d';
      ctx.shadowBlur = 7;
      ctx.fillStyle = '#ffd36b';
      ctx.fillRect(x + 8, y + 16, 3, 3);
      ctx.fillRect(x + en.w - 11, y + 16, 3, 3);
      ctx.fillStyle = armor;
      ctx.strokeStyle = '#ffbd8b';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx, y + 2);
      ctx.lineTo(cx + 5, y + 7);
      ctx.lineTo(x + en.w - 1, y + 12);
      ctx.lineTo(x + en.w - 7, y + 14);
      ctx.lineTo(cx + 4, y + 18);
      ctx.lineTo(cx, y + 15);
      ctx.lineTo(cx - 4, y + 18);
      ctx.lineTo(x + 7, y + 14);
      ctx.lineTo(x + 1, y + 12);
      ctx.lineTo(cx - 5, y + 7);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#4c1a2a';
      ctx.beginPath();
      ctx.ellipse(cx, y + 10, 5, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = pulse ? '#fff4c2' : '#ffbd58';
      ctx.shadowColor = '#ffe58a';
      ctx.shadowBlur = 5;
      ctx.fillRect(cx - 1, y + 8, 2, 3);
      ctx.restore();
    }

    function drawExplosion(ex) {
      const size = 22 - ex.life;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(ex.x - size / 2, ex.y - size / 2, size, size);
      if (ex.life % 2 === 0) {
        ctx.fillStyle = '#ffd600';
        ctx.fillRect(ex.x - size / 4, ex.y - size / 4, size / 2, size / 2);
      }
    }

    function drawLifeItem(item, time) {
      const bob = Math.sin(time / 150 + item.phase) * 2;
      const x = item.x, y = item.y + bob;
      ctx.save();
      ctx.shadowColor = '#57ff9a';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#159b60';
      ctx.strokeStyle = '#baffd4';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, y - 11);
      ctx.lineTo(x + 10, y - 6);
      ctx.lineTo(x + 8, y + 6);
      ctx.lineTo(x, y + 11);
      ctx.lineTo(x - 8, y + 6);
      ctx.lineTo(x - 10, y - 6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#effff5';
      ctx.fillRect(x - 2, y - 6, 4, 12);
      ctx.fillRect(x - 6, y - 2, 12, 4);
      ctx.restore();
    }

    function draw(time) {
      drawStarfield(time);

      if (!started) {
        ctx.font = '24px monospace';
        ctx.fillStyle = '#0f0';
        ctx.fillText('MINI GALAGA', 130, 260);
        ctx.font = '16px monospace';
        ctx.fillText('PRESS SPACE TO START', 120, 300);
        ctx.fillText(`HIGH SCORE: ${highScore}`, 140, 340);
        ctx.font = '12px monospace';
        ctx.fillText('MOBILE: tap lower left/right to move, tap top to shoot', 18, 610);
        return;
      }

      // Player
      drawPlayer(player.x, player.y, true);

      // Player bullets
      ctx.fillStyle = '#ffd600';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Enemy bullets
      ctx.fillStyle = '#40c4ff';
      enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Boss lasers
      ctx.fillStyle = 'rgba(0,255,255,0.35)';
      bossLasers.forEach(b => {
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = 'rgba(200,255,255,0.8)';
        ctx.fillRect(b.x + b.w / 3, b.y, b.w / 3, b.h);
        ctx.fillStyle = 'rgba(0,255,255,0.35)';
      });

      // Enemies
      enemies.forEach(en => en.alive && drawEnemy(en, time));

      // Occasional extra-life pickup
      lifeItems.forEach(item => drawLifeItem(item, time));

      // Explosions
      explosions.forEach(drawExplosion);

      // HUD
      ctx.fillStyle = '#0f0';
      ctx.font = '16px monospace';
      ctx.fillText(`SCORE: ${score}`, 10, 20);

      // High score blink when updated
      if (hiBlinkTimer > 0) {
        hiBlinkTimer--;
        if (!hiSoundPlayed) {
          beep(1200, 0.15);
          hiSoundPlayed = true;
        }
        const on = Math.floor(hiBlinkTimer / 10) % 2 === 0;
        ctx.fillStyle = on ? '#ffffff' : '#0f0';
      } else {
        ctx.fillStyle = '#0f0';
      }
      ctx.fillText(`HI: ${highScore}`, 180, 20);

      ctx.fillStyle = '#0f0';
      ctx.fillText(`LIVES: ${lives}`, 320, 20);
      ctx.fillText(`STAGE: ${stage}`, 10, 40);

      if (gameOver) {
        ctx.font = '24px monospace';
        ctx.fillText('GAME OVER', 150, 320);
        ctx.font = '14px monospace';
        ctx.fillText('PRESS SPACE TO RESTART', 130, 350);
      }
    }

    function loop(time) {
      update(time);
      draw(time);
      requestAnimationFrame(loop);
    }

    // =====================
    // Tests
    // =====================
    function runTests() {
      const assert = (c, m) => { if (!c) throw new Error('Test failed: ' + m); };
      __TESTING = true;

      resetGame();
      started = true;

      // Formation should be deterministic in tests
      const formationEnemy = enemies.find(e => e.type === 'normal');
      const fxBefore = formationEnemy.x;
      update(0);
      assert(formationEnemy.x === fxBefore, 'formation position stable during tests');

      // Kill normal enemy increments score and triggers explosion
      const e0 = enemies.find(e => e.type === 'normal');
      bullets.push({ x: e0.x + 1, y: e0.y + 8, w: 4, h: 8, dead: false });
      update(0);
      assert(score === 100, 'score increments (normal enemy)');
      assert(explosions.length > 0, 'explosion triggered');

      // Enemy bullet damages player
      enemyBullets.push({ x: player.x, y: player.y, w: 4, h: 8, dead: false });
      update(0);
      assert(lives === 2, 'enemy bullet damages player');

      // Invincibility prevents damage
      player.invincible = 10;
      const livesBefore = lives;
      enemyBullets.push({ x: player.x, y: player.y, w: 4, h: 8, dead: false });
      update(0);
      assert(lives === livesBefore, 'invincibility should block bullet damage');

      // Bullet removed on hit (sanity)
      assert(bullets.length === 0, 'player bullet should be removed after hit');

      // Boss should exist on stage 3 and take 8 hits
      stage = 3;
      score = 0;
      bullets = [];
      enemyBullets = [];
      explosions = [];
      bossLasers = [];
      initEnemies();
      started = true;

      const boss = enemies.find(e => e.type === 'boss');
      assert(!!boss, 'boss spawns on stage 3');
      assert(boss.hp === 8, 'boss starts with 8 hp');

      // Stage 1: single laser
      stage = 1;
      bossLasers = [];
      fireBossLaser(boss);
      assert(bossLasers.length === 1, 'stage <10 fires single laser');

      // Stage 10: two-way spread
      stage = 10;
      bossLasers = [];
      fireBossLaser(boss);
      assert(bossLasers.length === 2, 'stage >=10 fires two lasers');

      // Stage 20: three-way missiles
      stage = 20;
      bossLasers = [];
      fireBossLaser(boss);
      assert(bossLasers.length === 3, 'stage >=20 fires three lasers');

      // Boss laser damages player and respawns ship
      lives = 3;
      player.invincible = 0;
      player.x = canvas.width / 2 - player.w / 2;
      player.y = canvas.height - 60;

      bossLasers[0].x = player.x;
      bossLasers[0].y = player.y;
      update(0);
      assert(lives === 2, 'boss laser reduces lives by 1');
      assert(player.y === canvas.height - 60, 'player respawns at bottom after boss laser hit');

      // Kill boss and ensure lasers are cleaned
      bossLasers = [];
      stage = 3;
      for (let i = 0; i < 8; i++) {
        bullets.push({ x: boss.x + 1, y: boss.y + boss.h - 2, w: 4, h: 8, dead: false });
        update(0);
      }
      assert(!boss.alive, 'boss dies after 8 hits');
      assert(bossLasers.length === 0, 'boss death removes its lasers');

      __TESTING = false;
      console.log('%cAll tests passed', 'color:#0f0');
    }

    if (RUN_TESTS) runTests();

    requestAnimationFrame(loop);
  </script>
</body>
