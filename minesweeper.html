<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b161d" />
  <title>네온 지뢰찾기</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;background:radial-gradient(ellipse at 50% 0,#1c3d3e,#102126 54%,#091317);color:#effaf5;font-family:system-ui,sans-serif}.app{width:min(100%,560px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.icon{font-size:28px}.brand h1{margin:0;font-size:22px;letter-spacing:-.04em}.brand small{color:#9bb8ad}a{color:#9de5c9;text-decoration:none;font-size:13px}.panel{padding:18px;border:1px solid #b2f2d31b;border-radius:20px;background:linear-gradient(145deg,#1a2b2a,#111d20);box-shadow:0 20px 50px #0005}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.stat{padding:9px 12px;background:#0c1718;border:1px solid #ffffff0b;border-radius:12px}.stat small{display:block;color:#8fa9a1;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.stat strong{display:block;margin-top:2px;font-size:18px;font-variant-numeric:tabular-nums}.stat:last-child{text-align:right}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0}.tools{display:flex;gap:8px}.btn{padding:9px 12px;border:1px solid #b5efd12b;border-radius:10px;background:#112420;color:#dff8eb;font:650 12px system-ui;cursor:pointer}.btn:hover{background:#1c3a31}.btn:focus-visible,.cell:focus-visible{outline:2px solid #c5ffe0;outline-offset:2px}.btn.primary{background:linear-gradient(135deg,#3ba87d,#247665);color:#fff}.btn[aria-pressed=true]{border-color:#8fe3bd;color:#9ef2c9;background:#193a30}.status{min-height:28px;margin:8px 0 12px;text-align:center;color:#a7c4b8;font-size:13px}.status.good{color:#93f1c1}.status.bad{color:#ffaaa4}.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;width:min(100%,460px);margin:0 auto;padding:9px;border:1px solid #a3f4c51e;border-radius:14px;background:#0a1416}.cell{display:grid;place-items:center;min-width:0;aspect-ratio:1;padding:0;border:1px solid #9bd9c52b;border-radius:6px;background:linear-gradient(145deg,#284642,#1c3535);color:#eafff5;font:750 clamp(12px,3vw,19px) system-ui;cursor:pointer;box-shadow:inset 0 1px 2px #ffffff10;transition:background .12s,transform .12s}.cell:hover:not(.open){transform:translateY(-1px);background:#315950}.cell.open{cursor:default;border-color:#ffffff0c;background:#dcebe3;color:#223d38;box-shadow:none}.cell.mine{background:#7d353c;color:#fff}.cell.flag{color:#ffce72}.n1{color:#2374d3}.n2{color:#20834b}.n3{color:#d44848}.n4{color:#7148b9}.n5{color:#9a482d}.n6{color:#168c91}.n7{color:#27313c}.n8{color:#626d7c}.foot{text-align:center;color:#829e96;font-size:11px;margin:16px 4px 0}.foot kbd{padding:2px 6px;border:1px solid #b5ccbf35;border-radius:5px;background:#101a18;color:#e1eee6;font:10px ui-monospace,monospace}@media(max-width:440px){body{padding:16px 9px}.panel{padding:12px}.board{gap:3px;padding:6px}.btn{padding:8px 9px;font-size:11px}.brand h1{font-size:19px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><span class="icon">💣</span><div><h1>네온 지뢰찾기</h1><small>숫자 힌트를 따라 안전 지대를 열어보세요</small></div></div><a href="./index.html">← 게임 목록</a></header>
    <section class="panel" aria-label="지뢰찾기 게임">
      <div class="hud"><div class="stat"><small>남은 지뢰</small><strong id="remaining">15</strong></div><div class="stat"><small>경과 시간</small><strong id="timer">00:00</strong></div><div class="stat"><small>최고 기록</small><strong id="best">--:--</strong></div></div>
      <div class="toolbar"><div class="tools"><button class="btn primary" id="new">새 게임</button><button class="btn" id="flagMode" aria-pressed="false">🚩 깃발 모드</button></div><button class="btn" id="sound" aria-pressed="true">🔊 소리 켜짐</button></div>
      <p class="status" id="status" aria-live="polite">칸을 열어 시작하세요. 첫 클릭은 안전합니다.</p>
      <div class="board" id="board" role="grid" aria-label="10 곱하기 10 지뢰찾기 보드"></div>
      <p class="foot">칸 열기: 클릭 · 지뢰 표시: 우클릭 또는 깃발 모드<br>숫자는 주변 8칸의 지뢰 개수입니다.</p>
    </section>
  </main>
<script>
const SIZE=10,MINES=15,$=id=>document.getElementById(id),boardEl=$('board');let cells=[],started=false,finished=false,flagMode=false,flags=0,revealed=0,seconds=0,timerId=null,muted=false,audio;
let best=Number(localStorage.getItem('minesweeperBest')||0);$('best').textContent=best?format(best):'--:--';
function format(n){return`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function tone(freq,dur=.08,type='sine',volume=.04,delay=0){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur)}catch{audio=undefined}}
function build(){clearInterval(timerId);started=finished=false;flagMode=false;flags=revealed=seconds=0;$('flagMode').setAttribute('aria-pressed','false');$('remaining').textContent=MINES;$('timer').textContent='00:00';$('status').className='status';$('status').textContent='칸을 열어 시작하세요. 첫 클릭은 안전합니다.';boardEl.replaceChildren();cells=Array.from({length:SIZE*SIZE},(_,i)=>({i,mine:false,adj:0,revealed:false,flagged:false,el:document.createElement('button')}));cells.forEach(c=>{c.el.type='button';c.el.className='cell';c.el.setAttribute('role','gridcell');c.el.setAttribute('aria-label',`행 ${Math.floor(c.i/SIZE)+1}, 열 ${c.i%SIZE+1}, 닫힘`);c.el.addEventListener('click',()=>flagMode?toggleFlag(c):reveal(c));c.el.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(c)});boardEl.append(c.el)})}
function neighbors(i){const x=i%SIZE,y=Math.floor(i/SIZE),out=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE)out.push(ny*SIZE+nx)}return out}
function placeMines(safe){const excluded=new Set([safe,...neighbors(safe)]),pool=cells.filter(c=>!excluded.has(c.i));for(let n=0;n<MINES;n++){const j=Math.floor(Math.random()*pool.length),c=pool.splice(j,1)[0];c.mine=true}for(const c of cells)c.adj=neighbors(c.i).filter(i=>cells[i].mine).length}
function begin(first){placeMines(first.i);started=true;timerId=setInterval(()=>{seconds++;$('timer').textContent=format(seconds)},1000)}
function toggleFlag(c){if(finished||c.revealed)return;if(!started&&!flagMode){$('status').textContent='먼저 안전한 칸을 열어 시작하세요.';return}if(!c.flagged&&flags>=MINES)return;c.flagged=!c.flagged;flags+=c.flagged?1:-1;tone(c.flagged?520:340,.06,'square',.025);paint(c);$('remaining').textContent=MINES-flags;if(flagMode&&!started)$('status').textContent='깃발을 놓았습니다. 칸을 열어 타이머를 시작하세요.'}
function reveal(c){if(finished||c.revealed||c.flagged)return;if(!started)begin(c);if(c.mine){c.revealed=true;paint(c);finish(false);return}const queue=[c.i];while(queue.length){const i=queue.pop(),cell=cells[i];if(cell.revealed||cell.flagged||cell.mine)continue;cell.revealed=true;revealed++;paint(cell);if(cell.adj) tone(520+cell.adj*65,.045,'sine',.015);else queue.push(...neighbors(i))}if(revealed===SIZE*SIZE-MINES)finish(true)}
function paint(c){const b=c.el;b.className='cell';b.textContent='';if(c.flagged){b.classList.add('flag');b.textContent='🚩';b.setAttribute('aria-label',`행 ${Math.floor(c.i/SIZE)+1}, 열 ${c.i%SIZE+1}, 깃발`)}else if(c.revealed){b.classList.add('open');if(c.mine){b.classList.add('mine');b.textContent='💥';b.setAttribute('aria-label','지뢰')}else if(c.adj){b.textContent=c.adj;b.classList.add(`n${c.adj}`);b.setAttribute('aria-label',`${c.adj}개의 주변 지뢰`)}else b.setAttribute('aria-label','빈 칸')}else b.setAttribute('aria-label',`행 ${Math.floor(c.i/SIZE)+1}, 열 ${c.i%SIZE+1}, 닫힘`)}
function finish(won){finished=true;clearInterval(timerId);if(won){tone(660,.18,'triangle',.05);tone(830,.18,'triangle',.05,.13);tone(990,.32,'triangle',.05,.26);if(!best||seconds<best){best=seconds;localStorage.setItem('minesweeperBest',best);$('best').textContent=format(best)}$('status').className='status good';$('status').textContent=`완벽해요! ${format(seconds)} 만에 모든 안전 칸을 찾았습니다.`}else{for(const c of cells)if(c.mine){c.revealed=true;paint(c)}tone(125,.4,'sawtooth',.06);$('status').className='status bad';$('status').textContent='지뢰를 밟았습니다. 새 게임으로 다시 도전하세요.'}}
$('new').addEventListener('click',()=>{build();tone(440,.07,'triangle',.025)});$('flagMode').addEventListener('click',()=>{flagMode=!flagMode;$('flagMode').setAttribute('aria-pressed',String(flagMode));$('status').textContent=flagMode?'깃발 모드: 칸을 눌러 깃발을 놓거나 회수하세요.':'칸 열기 모드입니다.';tone(flagMode?580:390,.06,'triangle',.025)});$('sound').addEventListener('click',()=>{muted=!muted;$('sound').textContent=muted?'🔇 소리 꺼짐':'🔊 소리 켜짐';$('sound').setAttribute('aria-pressed',String(!muted));if(!muted)tone(660,.1,'triangle',.03)});build();
</script>
</body>
</html>
