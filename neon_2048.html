<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#151224" />
  <title>네온 2048</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at 50% 0,#3a294e,#1b1830 58%,#11101e);color:#f7f1ff;font-family:system-ui,sans-serif}.app{width:min(100%,520px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand h1{margin:0;font-size:28px;letter-spacing:-.05em}.brand p{margin:3px 0 0;color:#b8abc9;font-size:12px}a{color:#edc1ff;text-decoration:none;font-size:13px}.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}.score{padding:8px 12px;text-align:center;border:1px solid #e8bfff20;border-radius:11px;background:#211d35}.score small{display:block;color:#b6a8c8;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.score strong{font-size:19px;font-variant-numeric:tabular-nums}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:100%;aspect-ratio:1;margin:15px auto 0;padding:10px;border:1px solid #f4d4ff27;border-radius:18px;background:#2b2540;box-shadow:0 20px 55px #0005;touch-action:none;user-select:none}.cell{display:grid;place-items:center;min-width:0;aspect-ratio:1;border-radius:11px;background:#403853;color:#fff;font-size:clamp(19px,6vw,34px);font-weight:800;letter-spacing:-.04em;transition:transform .1s,background .15s}.cell.filled{box-shadow:inset 0 1px 0 #ffffff4a,0 5px 12px #0002}.v2{background:#eee6ff;color:#55406e}.v4{background:#dfcaff;color:#59377d}.v8{background:#c89df3;color:#341f53}.v16{background:#b479e5;color:#fff}.v32{background:#a85fd3;color:#fff}.v64{background:#9650bb;color:#fff}.v128{background:#f0bb75;color:#382247;font-size:clamp(16px,5vw,28px)}.v256{background:#f2a95e;color:#382247;font-size:clamp(16px,5vw,28px)}.v512{background:#fc927b;color:#39213a;font-size:clamp(16px,5vw,28px)}.v1024{background:#ed719d;color:#fff;font-size:clamp(14px,4.5vw,24px)}.v2048{background:linear-gradient(135deg,#fff09b,#ffae56 52%,#f478ba);color:#3a2043;font-size:clamp(14px,4.5vw,24px);box-shadow:0 0 22px #ffd56f99!important}.controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}.buttons{display:flex;gap:7px}.btn{padding:9px 12px;border:1px solid #e7c5fa30;border-radius:10px;background:#28223a;color:#eee2fb;font:650 12px system-ui;cursor:pointer}.btn:hover{background:#3c3152}.btn.primary{background:linear-gradient(135deg,#a76bd0,#7748a8);color:#fff}.btn:focus-visible{outline:2px solid #ffd78f;outline-offset:2px}.status{min-height:24px;margin:13px 4px 0;text-align:center;color:#c7b3df;font-size:13px}.status.win{color:#ffe391}.status.over{color:#ffa0aa}.help{text-align:center;color:#a99bbd;font-size:11px;margin:10px 0 0}.help kbd{padding:2px 5px;border:1px solid #fff2;border-radius:5px;background:#272239;color:#f5ecff;font:10px ui-monospace,monospace}@media(max-width:380px){body{padding:14px 10px}.board{gap:6px;padding:7px;border-radius:14px}.cell{border-radius:8px}.brand h1{font-size:24px}.btn{padding:8px 9px;font-size:11px}}
  </style>
</head>
<body>
  <main class="app"><header class="top"><div class="brand"><h1>🔢 네온 2048</h1><p>같은 숫자를 합쳐 2048 타일을 만드세요</p></div><a href="./index.html">← 게임 목록</a></header>
    <div class="scores"><div class="score"><small>점수</small><strong id="score">0</strong></div><div class="score"><small>최고 점수</small><strong id="best">0</strong></div></div>
    <div class="board" id="board" role="grid" aria-label="2048 게임판"></div>
    <div class="controls"><div class="buttons"><button class="btn primary" id="new">새 게임</button><button class="btn" id="sound" aria-pressed="true">🔊 소리 켜짐</button></div><button class="btn" id="continue" hidden>계속하기</button></div>
    <p class="status" id="status" aria-live="polite">방향키 또는 WASD로 타일을 움직이세요.</p>
    <p class="help"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 또는 <kbd>W A S D</kbd> 조작 · 모바일은 스와이프</p>
  </main>
<script>
const N=4,$=id=>document.getElementById(id),boardEl=$('board');let grid,score=0,best=Number(localStorage.getItem('neon2048Best')||0),won=false,over=false,muted=false,audio,touchStart=null;
function sound(freq=440,dur=.09,type='sine',vol=.04,delay=0){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur)}catch{audio=undefined}}
function newGame(){grid=Array.from({length:N},()=>Array(N).fill(0));score=0;won=over=false;$('continue').hidden=true;$('status').className='status';$('status').textContent='방향키 또는 WASD로 타일을 움직이세요.';spawn();spawn();render()}
function spawn(){const empty=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!grid[y][x])empty.push([y,x]);if(!empty.length)return;const [y,x]=empty[Math.floor(Math.random()*empty.length)];grid[y][x]=Math.random()<.9?2:4}
function move(dir){if(over)return;const before=grid.map(row=>row.join(',')).join(';'),merges=[];for(let line=0;line<N;line++){const coords=Array.from({length:N},(_,i)=>dir==='left'?[line,i]:dir==='right'?[line,N-1-i]:dir==='up'?[i,line]:[N-1-i,line]),vals=coords.map(([y,x])=>grid[y][x]).filter(Boolean),next=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){const v=vals[i]*2;next.push(v);score+=v;merges.push(v);i++}else next.push(vals[i])}while(next.length<N)next.push(0);coords.forEach(([y,x],i)=>grid[y][x]=next[i])}if(before===grid.map(row=>row.join(',')).join(';'))return;spawn();if(score>best){best=score;localStorage.setItem('neon2048Best',String(best))}if(merges.length){const max=Math.max(...merges);sound(420+Math.min(Math.log2(max),11)*45,.11,'triangle',.04);if(max>=32)sound(780,.14,'sine',.03,.08)}else sound(290,.04,'square',.012);if(!won&&grid.some(row=>row.includes(2048))){won=true;$('status').className='status win';$('status').textContent='축하해요! 2048을 만들었습니다. 계속 도전할 수도 있어요.';$('continue').hidden=false;[523,659,784,1047].forEach((f,i)=>sound(f,.2,'triangle',.045,i*.13))}render();if(!hasMoves()){over=true;$('status').className='status over';$('status').textContent='더 움직일 수 없어요. 새 게임으로 다시 도전하세요.';sound(150,.35,'sawtooth',.05)}}
function hasMoves(){if(grid.some(row=>row.includes(0)))return true;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(grid[y][x]===grid[y]?.[x+1]||grid[y][x]===grid[y+1]?.[x])return true;return false}
function render(){$('score').textContent=score;$('best').textContent=best;boardEl.innerHTML='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=grid[y][x],cell=document.createElement('div');cell.className='cell'+(v?` filled v${Math.min(v,2048)}`:'');cell.textContent=v||'';cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',v?String(v):'빈 칸');boardEl.append(cell)}}
const keys={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};document.addEventListener('keydown',e=>{if(e.key===' '||keys[e.key]){e.preventDefault();sound();if(keys[e.key])move(keys[e.key])}});boardEl.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStart=[t.clientX,t.clientY]},{passive:true});boardEl.addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart[0],dy=t.clientY-touchStart[1];touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});$('new').addEventListener('click',()=>{newGame();sound(520,.1,'triangle')});$('continue').addEventListener('click',()=>{$('continue').hidden=true;$('status').className='status';$('status').textContent='2048을 만들었어요! 더 높은 타일에 도전하세요.'});$('sound').addEventListener('click',()=>{muted=!muted;$('sound').textContent=muted?'🔇 소리 꺼짐':'🔊 소리 켜짐';$('sound').setAttribute('aria-pressed',String(!muted));if(!muted)sound(660,.1,'triangle')});newGame();
</script>
</body>
</html>
