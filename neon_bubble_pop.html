<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#12101f">
<title>네온 버블 팝 — Web Game Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;background:radial-gradient(ellipse at 50% 0,#2b2350 0,#181430 43%,#0b0a18 100%);color:#f2f0ff;font-family:system-ui,-apple-system,sans-serif}.app{width:min(100%,560px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{display:flex;align-items:center;gap:11px}.icon{font-size:27px}.brand h1{margin:0;font-size:21px;letter-spacing:-.04em}.brand small{color:#b3aee8}a{color:#c8b8ff;text-decoration:none;font-size:13px}.panel{border:1px solid #ffffff1a;border-radius:22px;background:linear-gradient(145deg,#221c42f5,#17132df7);box-shadow:0 20px 50px #0005;padding:17px}.hud{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px;margin-bottom:12px}.stat{padding:9px 10px;background:#0e0c1e;border:1px solid #ffffff0d;border-radius:12px;text-align:center}.stat small{display:block;color:#9d97c9;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.stat strong{display:block;margin-top:2px;font-size:19px;font-variant-numeric:tabular-nums}.stat.combo strong{color:#ffd66e}.board-wrap{position:relative;overflow:hidden;width:100%;aspect-ratio:4/5;border-radius:14px;border:1px solid #a78bfa33;background:radial-gradient(circle at 50% 110%,#2a1e5e 0,#0d0b1e 65%);cursor:crosshair;touch-action:manipulation}.board-wrap canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;background:#0a0818d9;backdrop-filter:blur(4px);z-index:2}.overlay[hidden]{display:none}.message{max-width:300px}.message .emoji{font-size:42px}.message h2{font-size:24px;margin:4px 0 7px}.message p{font-size:13px;color:#b9b3de;line-height:1.55;margin:0 0 15px}.btn{border:0;border-radius:12px;padding:12px 20px;background:linear-gradient(135deg,#a78bfa,#6d5df0);color:#fff;font:750 14px system-ui;cursor:pointer;box-shadow:0 6px 18px #7c5cff33;transition:filter .15s,transform .15s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:focus-visible{outline:2px solid #e5d8ff;outline-offset:3px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 2px 0}.legend{color:#8f89b5;font-size:11px;line-height:1.5}.legend b{color:#e8e2ff}.tools{display:flex;gap:8px;flex-shrink:0}.tool{padding:7px 10px;border:1px solid #ffffff22;border-radius:9px;background:#171331;color:#e6e1ff;font:600 11px system-ui;cursor:pointer}.tool:hover{background:#251e4a}.foot{text-align:center;color:#8d88b3;font-size:11px;margin:14px 0 0}.foot kbd{padding:2px 6px;border:1px solid #ffffff25;border-radius:5px;background:#171331;color:#e6e1ff;font:10px ui-monospace,monospace}@media(max-width:560px){.hud{grid-template-columns:1fr 1fr}.board-wrap{aspect-ratio:1/1.1}}
</style></head>
<body><main class="app"><header class="top"><div class="brand"><span class="icon">🫧</span><div><h1>네온 버블 팝</h1><small>60초, 버블을 터뜨려 콤보를 쌓으세요</small></div></div><a href="./index.html">← 게임 목록</a></header>
<section class="panel" aria-label="네온 버블 팝 게임"><div class="hud"><div class="stat"><small>점수</small><strong id="score">0</strong></div><div class="stat"><small>최고 기록</small><strong id="best">0</strong></div><div class="stat"><small>남은 시간</small><strong id="time">60</strong></div><div class="stat combo"><small>콤보</small><strong id="combo">×1</strong></div></div>
<div class="board-wrap" id="board"><canvas id="game" width="520" height="650" aria-label="네온 버블 팝 게임 보드"></canvas><div class="overlay" id="overlay"><div class="message"><div class="emoji" id="emoji">🫧</div><h2 id="title">버블 팝 준비!</h2><p id="description">떠오르는 버블을 클릭 / 터치로 터뜨리세요.<br>💛 황금 버블 +50, 💣 폭탄은 피하세요!</p><button class="btn" id="start">게임 시작</button></div></div></div>
<div class="toolbar"><div class="legend"><b>🫧</b> +10 &nbsp; <b>💛</b> +50 &nbsp; <b>💣</b> -30 &amp; 콤보 초기화<br>연속으로 터뜨리면 콤보 보너스!</div><div class="tools"><button class="tool" id="sound" aria-pressed="true">🔊 효과음 켜짐</button><button class="tool" id="restart">↻ 재시작</button></div></div></section><p class="foot"><kbd>Space</kbd> 시작 / 재시작 &nbsp;·&nbsp; <kbd>M</kbd> 효과음 켜기 / 끄기</p></main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s);
let bubbles=[],particles=[],score=0,combo=0,comboTimer=0,playing=false,muted=false,audio=null,spawnTimer=null,gameTimer=null,timeLeft=60,lastTime=0;
let best=Number(localStorage.getItem('bubblePopBest')||0);$('#best').textContent=best;
function sound(freq=440,duration=.09,wave='sine',vol=.08,slideTo=null){
  if(muted) return;
  try{
    audio??=new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended') audio.resume();
    const osc=audio.createOscillator(),gain=audio.createGain();
    osc.type=wave;osc.frequency.setValueAtTime(freq,audio.currentTime);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo,audio.currentTime+duration);
    gain.gain.setValueAtTime(vol,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    osc.connect(gain);gain.connect(audio.destination);
    osc.start();osc.stop(audio.currentTime+duration);
  }catch(e){}
}
function popSound(kind){
  if(kind==='gold'){ sound(880,.12,'sine',.09); setTimeout(()=>sound(1320,.18,'sine',.09),70); }
  else if(kind==='bomb'){ sound(180,.3,'sawtooth',.1,40); }
  else { const base=420+Math.min(combo,12)*35; sound(base,.09,'triangle',.08,base*1.5); }
}
function startSound(){ sound(520,.1,'sine',.08); setTimeout(()=>sound(780,.12,'sine',.08),90); setTimeout(()=>sound(1040,.16,'sine',.08),180); }
function endSound(win){ if(win){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>sound(f,.18,'triangle',.09),i*110)); } else { sound(320,.3,'sawtooth',.08,140); } }
function spawn(){
  if(!playing) return;
  const r=18+Math.random()*26;
  const x=r+Math.random()*(520-r*2);
  const roll=Math.random();
  const kind=roll<0.12?'gold':roll<0.28?'bomb':'normal';
  bubbles.push({x,y:650+r,r,vy:-(0.7+Math.random()*1.1+Math.min(60-timeLeft,40)*0.02),wob:Math.random()*Math.PI*2,wobSpeed:.02+Math.random()*.03,kind,pop:0,hue:kind==='gold'?45:kind==='bomb'?350:190+Math.random()*90});
}
function burst(x,y,color){ for(let i=0;i<14;i++){ const a=Math.random()*Math.PI*2,sp=1+Math.random()*3.2; particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,decay:.03+Math.random()*.03,color,size:2+Math.random()*4}); } }
function reset(){ bubbles=[]; particles=[]; score=0; combo=0; comboTimer=0; timeLeft=60; $('#score').textContent='0'; $('#combo').textContent='×1'; $('#time').textContent='60'; }
function start(){ reset(); playing=true; $('#overlay').hidden=true; startSound(); clearInterval(spawnTimer); clearInterval(gameTimer); spawnTimer=setInterval(spawn,420); gameTimer=setInterval(()=>{ timeLeft--; $('#time').textContent=timeLeft; if(timeLeft<=5&&timeLeft>0) sound(900,.08,'sine',.06); if(timeLeft<=0) end(); },1000); lastTime=performance.now(); requestAnimationFrame(loop); }
function end(){ playing=false; clearInterval(spawnTimer); clearInterval(gameTimer); const record=score>best; if(record){ best=score; localStorage.setItem('bubblePopBest',best); $('#best').textContent=best; } endSound(score>=300); $('#emoji').textContent=score>=300?'🏆':score>=150?'🎉':'🫧'; $('#title').textContent='타임 오버!'; $('#description').innerHTML=`점수 <b>${score}점</b>${record?' · 새로운 최고 기록!':''}<br>최고 콤보 보너스로 더 높게 노려보세요!`; $('#start').textContent='다시 시작'; $('#overlay').hidden=false; }
function loop(now){ if(!playing) return; const dt=Math.min(32,now-lastTime); lastTime=now; ctx.clearRect(0,0,520,650);
  ctx.fillStyle='#0d0b1e'; ctx.fillRect(0,0,520,650);
  bubbles=bubbles.filter(b=>b.y+b.r>-20);
  bubbles.forEach(b=>{ b.y+=b.vy*(dt/16.6); b.wob+=b.wobSpeed; b.x+=Math.sin(b.wob)*.4; const scale=b.pop>0?1+b.pop*.15:1; const r=b.r*scale; const grad=ctx.createRadialGradient(b.x-r*.35,b.y-r*.35,r*.1,b.x,b.y,r); if(b.kind==='gold'){ grad.addColorStop(0,'#fff7cc'); grad.addColorStop(.6,'#ffd66e'); grad.addColorStop(1,'#ff9e2c'); } else if(b.kind==='bomb'){ grad.addColorStop(0,'#ff8a8a'); grad.addColorStop(.6,'#e11d48'); grad.addColorStop(1,'#7f1d1d'); } else { grad.addColorStop(0,'rgba(255,255,255,.95)'); grad.addColorStop(.35,`hsla(${b.hue},90%,65%,.85)`); grad.addColorStop(1,`hsla(${b.hue},90%,45%,.55)`); } ctx.beginPath(); ctx.arc(b.x,b.y,r,0,Math.PI*2); ctx.fillStyle=grad; ctx.shadowColor=b.kind==='gold'?'#ffd66e':b.kind==='bomb'?'#ff3b3b':'#7dd3fc'; ctx.shadowBlur=14; ctx.fill(); ctx.shadowBlur=0; ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.ellipse(b.x-r*.35,b.y-r*.4,r*.22,r*.12,-.6,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.font=`bold ${r*.9}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(b.kind==='gold'?'★':b.kind==='bomb'?'💣':'•',b.x,b.y+1); });
  particles=particles.filter(p=>p.life>0); particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.08; p.life-=p.decay; ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; });
  if(combo>0){ comboTimer-=dt; if(comboTimer<=0){ combo=0; $('#combo').textContent='×1'; } }
  requestAnimationFrame(loop);
}
function getPos(e){ const rect=canvas.getBoundingClientRect(); const cx=(e.clientX??e.touches?.[0]?.clientX)-rect.left; const cy=(e.clientY??e.touches?.[0]?.clientY)-rect.top; return {x:cx*520/rect.width,y:cy*650/rect.height}; }
function hit(e){ if(!playing) return; e.preventDefault(); const p=getPos(e); for(let i=bubbles.length-1;i>=0;i--){ const b=bubbles[i]; const d=Math.hypot(p.x-b.x,p.y-b.y); if(d<=b.r+4){ bubbles.splice(i,1); if(b.kind==='bomb'){ score=Math.max(0,score-30); combo=0; $('#combo').textContent='×1'; popSound('bomb'); burst(b.x,b.y,'#ff3b3b'); } else { combo++; comboTimer=1800; const base=b.kind==='gold'?50:10; const bonus=Math.min(combo,10)*2; const gained=base+bonus; score+=gained; $('#score').textContent=score; $('#combo').textContent='×'+(1+Math.min(combo,10)*.2).toFixed(1); popSound(b.kind); burst(b.x,b.y,b.kind==='gold'?'#ffd66e':'#7dd3fc'); } return; } } }
canvas.addEventListener('pointerdown',hit);
document.getElementById('start').addEventListener('click',start);
document.getElementById('restart').addEventListener('click',()=>{ if(playing) endSound(false); start(); });
document.getElementById('sound').addEventListener('click',()=>{ muted=!muted; const btn=document.getElementById('sound'); btn.textContent=muted?'🔇 효과음 꺼짐':'🔊 효과음 켜짐'; btn.setAttribute('aria-pressed',String(!muted)); if(!muted) sound(520,.1); });
document.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); start(); } if(e.key.toLowerCase()==='m'){ document.getElementById('sound').click(); } });
reset(); ctx.fillStyle='#0d0b1e'; ctx.fillRect(0,0,520,650);
</script></body></html>
