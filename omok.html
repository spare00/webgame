<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12201d">
<title>오목 20 × 20</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px 36px;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 0,#243a36,#101916 62%,#0a100e);color:#eff8f2;font-family:system-ui,sans-serif}h2{margin:0 0 16px;font-size:clamp(24px,5vw,34px);letter-spacing:-.04em}.game{width:min(100%,700px);padding:clamp(12px,3vw,22px);border:1px solid #d8f6d52b;border-radius:22px;background:#18241fe8;box-shadow:0 24px 70px #0007}#top-ui{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px}#turn-bar{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,24px);width:100%}.turn{padding:7px 13px;border:1px solid #ffffff20;border-radius:999px;opacity:.5;transition:.2s;font-size:clamp(14px,3vw,18px)}.turn.active{opacity:1;transform:scale(1.06);background:#d2f2a6;color:#172017;border-color:transparent;font-weight:750}#timer{min-width:76px;text-align:center;font-size:22px;font-variant-numeric:tabular-nums;font-weight:750;color:#a9edcb}#score{color:#bac9bf;font-size:14px}#score span{color:#fff;font-weight:700}#msg{min-height:28px;color:#dbf8a5;font-size:19px;font-weight:750;text-align:center}#controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}#controls button{padding:9px 15px;border:1px solid #ffffff24;border-radius:10px;background:#25352d;color:#eff8f2;font:inherit;font-size:14px;cursor:pointer;transition:background .15s,transform .15s}#controls button:hover{background:#354a3e;transform:translateY(-1px)}#controls button:focus-visible{outline:2px solid #d2f2a6;outline-offset:2px}.board-wrap{width:100%;overflow:hidden;border:1px solid #eed28d55;border-radius:12px;background:#d8b56a}canvas{display:block;width:100%;height:auto;aspect-ratio:1;touch-action:manipulation;cursor:crosshair}.hint{margin:12px 0 0;color:#a9b9ae;text-align:center;font-size:12px}@media(max-width:420px){body{padding:14px 8px 24px}.game{padding:10px;border-radius:16px}.turn{padding:6px 9px}#timer{min-width:58px;font-size:19px}}
</style>
</head>

<body>

<h2>오목 20 × 20</h2>

<section class="game" aria-label="오목 게임">
<div id="top-ui">

  <!-- 턴 & 타이머 -->
  <div id="turn-bar">
    <span id="turn-black" class="turn active">● 흑</span>

    <span id="timer">⏱ 10</span>

    <span id="turn-white" class="turn">● 백</span>
  </div>

  <!-- 스코어 -->
  <div id="score">
    흑 <span id="score-black">0</span>
    :
    <span id="score-white">0</span> 백
  </div>

  <!-- 메시지 -->
  <div id="msg"></div>

  <!-- 버튼 -->
  <div id="controls">
    <button onclick="resetGame()">다시 시작</button>
    <button onclick="undoMove()">한 수 무르기</button>
    <button onclick="resetScore()">스코어 리셋</button>
  </div>

</div>

<div class="board-wrap"><canvas id="board" width="600" height="600" aria-label="오목판. 빈 교차점을 눌러 돌을 놓으세요."></canvas></div>
<p class="hint">빈 교차점을 눌러 착수 · 흑과 백 모두 10초 제한 · 마지막 수는 초록색으로 표시</p>
</section>

<script>
/* ===== 기본 설정 ===== */
const SIZE=20, CELL=30, R=12;
const BLACK=1, WHITE=2;

const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const blackEl=document.getElementById("turn-black");
const whiteEl=document.getElementById("turn-white");
const msg=document.getElementById("msg");

function startTurnTimer(){
  clearInterval(timerId);
  turnTime = 10;
  updateTimerUI();

  timerId = setInterval(()=>{
    turnTime--;
    updateTimerUI();

    if(turnTime <= 0){
      clearInterval(timerId);
      handleTimeoutLoss();
    }
  },1000);
}

function stopTurnTimer(){
  clearInterval(timerId);
  timerId = null;
}

function updateTimerUI(){
  const t = document.getElementById("timer");
  t.textContent = "⏱ " + turnTime;

  if(turnTime <= 3){
    t.style.color = "#ff4444";
  } else {
    t.style.color = "#00ffcc";
  }
}

function handleTimeoutLoss(){
  if(gameOver) return;

  stopTurnTimer();
  playTimeoutWinSound();

  const winner = (current === BLACK) ? WHITE : BLACK;

  if(winner === BLACK){
    scoreBlack++;
    msg.textContent = "시간 초과! 흑 승리!";
  } else {
    scoreWhite++;
    msg.textContent = "시간 초과! 백 승리!";
  }

  updateScore();
  gameOver = true;
  wonOnLastMove = false;
}

/* ===== 사운드 ===== */
const AudioCtx=window.AudioContext||window.webkitAudioContext;
const audioCtx=new AudioCtx();
function playStone(){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type="square";o.frequency.value=300;
  g.gain.value=0.05;
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+0.06);
}

function playWinSound(){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();

  o.type = "triangle";
  o.frequency.setValueAtTime(440, audioCtx.currentTime);
  o.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.25);

  g.gain.value = 0.08;

  o.connect(g);
  g.connect(audioCtx.destination);

  o.start();
  o.stop(audioCtx.currentTime + 0.3);
}

function playTimeoutWinSound(){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();

  // 긴장감 있는 "시간 초과" 느낌
  o.type = "square";
  o.frequency.setValueAtTime(600, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.5);

  g.gain.setValueAtTime(0.12, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

  o.connect(g);
  g.connect(audioCtx.destination);

  o.start();
  o.stop(audioCtx.currentTime + 0.55);
}

/* ===== 상태 ===== */
let board,current,gameOver;
let wonOnLastMove=false;
let hover=null;
let lastMove=null;
let moveHistory=[];
let scoreBlack = 0;
let scoreWhite = 0;
let turnTime = 10;
let timerId = null;


/* ===== 초기화 ===== */
function resetGame(){
  stopTurnTimer();
  board=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
  current=BLACK;
  gameOver=false;
  wonOnLastMove=false;
  hover=null;
  lastMove=null;
  moveHistory=[];
  msg.textContent="";
  updateTurn();
  draw();
  updateScore();
  startTurnTimer();
}
resetGame();

function updateTurn(){
  blackEl.classList.toggle("active",current===BLACK);
  whiteEl.classList.toggle("active",current===WHITE);
}

function updateScore(){
  document.getElementById("score-black").textContent = scoreBlack;
  document.getElementById("score-white").textContent = scoreWhite;
}

function resetScore(){
  scoreBlack = 0;
  scoreWhite = 0;
  updateScore();
}

function undoMove(){
  if(gameOver && !wonOnLastMove){
    gameOver=false;msg.textContent="";updateTurn();draw();startTurnTimer();return;
  }
  if(!moveHistory.length) return;
  const move=moveHistory.pop();
  stopTurnTimer();
  if(gameOver){
    if(move.player===BLACK) scoreBlack=Math.max(0,scoreBlack-1);
    else scoreWhite=Math.max(0,scoreWhite-1);
  }
  board[move.y][move.x]=0;
  current=move.player;
  gameOver=false;
  wonOnLastMove=false;
  lastMove=moveHistory.length?moveHistory[moveHistory.length-1]:null;
  msg.textContent="";
  updateScore();updateTurn();draw();startTurnTimer();
}

function playForbiddenSound(){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();

  o.type = "sawtooth";
  o.frequency.setValueAtTime(180, audioCtx.currentTime);
  o.frequency.linearRampToValueAtTime(90, audioCtx.currentTime + 0.15);

  g.gain.value = 0.08;

  o.connect(g);
  g.connect(audioCtx.destination);

  o.start();
  o.stop(audioCtx.currentTime + 0.18);
}

/* ===== 그리기 ===== */
function draw(){
  ctx.clearRect(0,0,600,600);
  ctx.fillStyle="#d8b56a";ctx.fillRect(0,0,600,600);
  ctx.strokeStyle="#333";

  for(let i=0;i<SIZE;i++){
    ctx.beginPath();
    ctx.moveTo(CELL/2,CELL/2+i*CELL);
    ctx.lineTo(CELL/2+(SIZE-1)*CELL,CELL/2+i*CELL);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(CELL/2+i*CELL,CELL/2);
    ctx.lineTo(CELL/2+i*CELL,CELL/2+(SIZE-1)*CELL);
    ctx.stroke();
  }

  // 바둑판의 기준점
  ctx.fillStyle="#4a3824";
  for(const [x,y] of [[3,3],[3,16],[16,3],[16,16],[9,9]]){
    ctx.beginPath();ctx.arc(CELL/2+x*CELL,CELL/2+y*CELL,3.2,0,Math.PI*2);ctx.fill();
  }

  for(let y=0;y<SIZE;y++)
    for(let x=0;x<SIZE;x++)
      if(board[y][x]) drawStone(x,y,board[y][x]);

  if(lastMove){
    ctx.strokeStyle="#a6f28a";ctx.lineWidth=2;
    ctx.strokeRect(CELL/2+lastMove.x*CELL-4,CELL/2+lastMove.y*CELL-4,8,8);
  }

  // 금수 hover 표시
  if(hover && isForbiddenMove(hover.y,hover.x,current)){
    ctx.fillStyle="#ed634f";
    ctx.beginPath();
    ctx.arc(CELL/2+hover.x*CELL,CELL/2+hover.y*CELL,5,0,Math.PI*2);
    ctx.fill();
  }else if(hover){
    ctx.globalAlpha=.55;drawStone(hover.x,hover.y,current);ctx.globalAlpha=1;
  }
}

function drawStone(x,y,c){
  ctx.beginPath();
  ctx.arc(CELL/2+x*CELL,CELL/2+y*CELL,R,0,Math.PI*2);
  ctx.fillStyle=c===BLACK?"#000":"#fff";
  ctx.fill();ctx.stroke();
}

/* ===== 입력 ===== */
canvas.addEventListener("mousemove",e=>{
  if(gameOver){hover=null;draw();return;}
  const r=canvas.getBoundingClientRect();
  const x=Math.round((e.clientX-r.left)*SIZE/r.width-.5);
  const y=Math.round((e.clientY-r.top)*SIZE/r.height-.5);
  hover=(x>=0&&y>=0&&x<SIZE&&y<SIZE&&board[y][x]===0)?{x,y}:null;
  draw();
});
canvas.addEventListener("mouseleave",()=>{hover=null;draw();});



canvas.addEventListener("click", e => {
  // 오디오 컨텍스트 활성화 (브라우저 정책 대응)
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }

  if (gameOver) return;

  const rect = canvas.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) * SIZE / rect.width - .5);
  const y = Math.round((e.clientY - rect.top) * SIZE / rect.height - .5);

  if (x < 0 || y < 0 || x >= SIZE || y >= SIZE) return;
  if (board[y][x] !== 0) return;

  // 🚫 금수 판정 (흑/백 동일 적용)
  if (isForbiddenMove(y, x, current)) {
    playForbiddenSound();   // 🔊 금수 효과음
    return;                 // 착수 무효
  }

  stopTurnTimer();

  // ✅ 정상 착수
  board[y][x] = current;
  lastMove={x,y,player:current};
  moveHistory.push(lastMove);

  const maxL = getMaxLine(y, x, current);

  playStone();
  draw();

  // 🏆 승리 판정
  // 장목은 금수이므로, 여기서는 정확히 5목만 승리로 처리
  if (maxL === 5) {
    stopTurnTimer();
    playWinSound();

    if(current === BLACK){
      scoreBlack++;
      msg.textContent = "흑 승리!";
    } else {
      scoreWhite++;
      msg.textContent = "백 승리!";
    }

    updateScore();
    gameOver = true;
    wonOnLastMove = true;
    return;
  }

  // 🔄 턴 교체
  current = (current === BLACK) ? WHITE : BLACK;
  updateTurn();
  startTurnTimer();
});

/* ===== 승리/라인 ===== */
function getMaxLine(r,c,p){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  let max=1;
  for(const[dr,dc]of dirs){
    let cnt=1;
    let rr=r+dr,cc=c+dc;
    while(rr>=0&&cc>=0&&rr<SIZE&&cc<SIZE&&board[rr][cc]===p){
      cnt++;rr+=dr;cc+=dc;
    }
    rr=r-dr;cc=c-dc;
    while(rr>=0&&cc>=0&&rr<SIZE&&cc<SIZE&&board[rr][cc]===p){
      cnt++;rr-=dr;cc-=dc;
    }
    max=Math.max(max,cnt);
  }
  return max;
}

/* ===================================================
   ✅ 금수룰 (흑/백 동일 적용)
   - 금수: 쌍삼(3×3) + 장목(6목↑)
   - 4×3(사삼)은 항상 허용

   ✅ 대표님 규칙 반영:
   - "3"은 **끊김 없이 직접 연결된 3**만 인정합니다.
     (예: 01110 형태의 '연속 3' + 양끝이 빈칸)
   - 010110 같은 '끊긴 3(점프3)'은 3으로 보지 않습니다. (대표님 기준: 4쪽 성격)
=================================================== */

function countConsecutive(r, c, dr, dc, player){
  let n = 0;
  let rr = r + dr, cc = c + dc;
  while(rr>=0 && cc>=0 && rr<SIZE && cc<SIZE && board[rr][cc] === player){
    n++;
    rr += dr; cc += dc;
  }
  return n;
}

// ✅ "직접 연결된 열린 3" (연속 3 + 양끝이 비어있음)
function isOpenThreeDirConnected(r, c, dr, dc, player){
  const a = countConsecutive(r, c, dr, dc, player);
  const b = countConsecutive(r, c, -dr, -dc, player);
  const total = 1 + a + b;

  if(total !== 3) return false; // 끊긴3/4/2 등은 제외

  const end1r = r + (a + 1) * dr, end1c = c + (a + 1) * dc;
  const end2r = r - (b + 1) * dr, end2c = c - (b + 1) * dc;

  // 양끝이 모두 "보드 안" + "빈칸"이어야 열린3
  if(end1r < 0 || end1c < 0 || end1r >= SIZE || end1c >= SIZE) return false;
  if(end2r < 0 || end2c < 0 || end2r >= SIZE || end2c >= SIZE) return false;
  if(board[end1r][end1c] !== 0) return false;
  if(board[end2r][end2c] !== 0) return false;

  return true;
}

function countOpenThreeDirsFromMove(r, c, player){
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  let cnt = 0;
  for(const [dr, dc] of dirs){
    if(isOpenThreeDirConnected(r, c, dr, dc, player)) cnt++;
  }
  return cnt; // 방향 기준 열린3 개수
}

// ✅ 흑/백 동일 금수룰: (쌍삼) 또는 (장목=6목 이상)
function isForbiddenMove(r, c, player){
  if(board[r][c] !== 0) return false;

  board[r][c] = player;

  const maxL = getMaxLine(r, c, player);
  const open3Dirs = countOpenThreeDirsFromMove(r, c, player);

  board[r][c] = 0;

  return (maxL >= 6 || open3Dirs >= 2);
}

</script>

</body>
</html>
