<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#12142b" />
  <title>스카이라인 스택</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0,#3a335d,#17172f 58%,#0c0e20);color:#f4f1ff;font-family:system-ui,sans-serif}main{width:min(100%,940px);text-align:center}.top{display:flex;align-items:center;justify-content:space-between;margin:0 auto 14px;max-width:900px}.brand{text-align:left}.brand h1{margin:0;font-size:clamp(22px,4vw,32px);letter-spacing:-.04em}.brand p{margin:4px 0 0;color:#b4a9cf;font-size:12px}a{color:#ffd293;text-decoration:none;font-size:13px}.game{overflow:hidden;border:1px solid #edc27b3b;border-radius:18px;background:#12142b;box-shadow:0 24px 80px #0009}.game canvas{display:block;width:100%;height:auto;touch-action:manipulation}.drop{display:none;margin:12px auto 0;padding:13px 46px;border:1px solid #ffe0a559;border-radius:12px;background:linear-gradient(135deg,#f7c56e,#e58657);color:#281a26;font:800 14px system-ui;touch-action:manipulation}.help{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px;margin:13px 0 0;color:#b0a9c9;font-size:12px}.help b{color:#fff4df}@media(max-width:600px){body{padding:12px 8px}.help{gap:6px 10px;font-size:10px}.drop{display:block}}
  </style>
</head>
<body>
  <main>
    <header class="top"><div class="brand"><h1>🏙️ 스카이라인 스택</h1><p>정확한 타이밍으로 도시의 새 랜드마크를 세우세요</p></div><a href="./index.html">← 게임 목록</a></header>
    <div class="game" id="game"></div>
    <button id="drop" class="drop">층 쌓기</button>
    <p class="help"><span><b>Space / 클릭</b> 블록 놓기</span><span><b>M</b> 효과음 켜기/끄기</span><span><b>R</b> 다시 시작</span></p>
  </main>
  <script type="module" src="/src/skylineStack.ts"></script>
</body>
</html>
