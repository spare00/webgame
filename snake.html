<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101a19">
<title>Snake — Web Game Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;background:radial-gradient(ellipse at 50% 0,#1b3b30 0,#14241f 43%,#0b1111 100%);color:#eff8ee;font-family:system-ui,-apple-system,sans-serif}.app{width:min(100%,540px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{display:flex;align-items:center;gap:11px}.icon{font-size:27px}.brand h1{margin:0;font-size:21px;letter-spacing:-.04em}.brand small{color:#98b2a4}a{color:#ade4a0;text-decoration:none;font-size:13px}.panel{border:1px solid #d1f4d31b;border-radius:22px;background:linear-gradient(145deg,#1b2924f5,#131d1af7);box-shadow:0 20px 50px #0005;padding:17px}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:14px}.stat{padding:9px 12px;background:#0c1411;border:1px solid #ffffff0b;border-radius:12px}.stat small{display:block;color:#8fa89a;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.stat strong{display:block;margin-top:2px;font-size:19px;font-variant-numeric:tabular-nums}.stat:last-child{text-align:right}.board-wrap{position:relative;overflow:hidden;width:100%;aspect-ratio:1;border-radius:14px;border:1px solid #8ab99542;background:#0a1511;box-shadow:inset 0 0 40px #0008}.board-wrap canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;background:#08100dd9;backdrop-filter:blur(4px)}.overlay[hidden]{display:none}.message{max-width:280px}.message .emoji{font-size:42px}.message h2{font-size:24px;margin:4px 0 7px}.message p{font-size:13px;color:#a9bdb0;line-height:1.55;margin:0 0 15px}.btn{border:1px solid #b1f28655;border-radius:12px;padding:12px 20px;background:linear-gradient(135deg,#73cb78,#3e9a63);color:#102017;font:750 14px system-ui;cursor:pointer;box-shadow:0 6px 18px #4aca5e24;transition:filter .15s,transform .15s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:focus-visible,.direction:focus-visible{outline:2px solid #e5ffc2;outline-offset:3px}.below{display:flex;justify-content:space-between;align-items:center;margin:13px 2px 0;color:#8da194;font-size:11px}.below b{color:#c1d3c4}.controls{display:none;margin:18px auto 2px;width:174px;grid-template-columns:repeat(3,1fr);gap:6px;touch-action:manipulation}.direction{height:48px;border:1px solid #c5ecc52b;border-radius:12px;background:#101a16;color:#daf4d2;font-size:20px}.direction:active{background:#24422e}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.foot{text-align:center;color:#81968a;font-size:11px;margin:17px 0 0}.foot kbd{padding:2px 6px;border:1px solid #b8cfbd35;border-radius:5px;background:#111a16;color:#dbe8dc;font:10px ui-monospace,monospace}@media(max-width:600px){body{padding:18px 12px}.controls{display:grid}.below{font-size:10px}}@media(max-width:360px){.panel{padding:12px}.stat{padding:8px}.brand h1{font-size:18px}}
</style><style>.toolbar{display:flex;justify-content:flex-end;gap:8px;margin:-3px 0 11px}.tool{padding:7px 10px;border:1px solid #c5ecc52b;border-radius:9px;background:#101a16;color:#d7e8d8;font:600 11px system-ui;cursor:pointer}.tool:hover{background:#20372a}.tool:focus-visible{outline:2px solid #e5ffc2;outline-offset:2px}</style></head>
<body><main class="app"><header class="top"><div class="brand"><span class="icon">🐍</span><div><h1>Snake</h1><small>먹이를 먹고 최고 기록에 도전하세요</small></div></div><a href="./index.html">← 게임 목록</a></header>
<section class="panel" aria-label="스네이크 게임"><div class="hud"><div class="stat"><small>점수</small><strong id="score">0</strong></div><div class="stat"><small>최고 기록</small><strong id="best">0</strong></div><div class="stat"><small>속도</small><strong id="speed">1×</strong></div></div><div class="board-wrap"><canvas id="game" width="480" height="480" aria-label="스네이크 게임 보드"></canvas><div class="overlay" id="overlay"><div class="message"><div class="emoji" id="emoji">🐍</div><h2 id="title">출발 준비!</h2><p id="description">방향키 또는 WASD로 조작하세요.<br>모바일에서는 아래 버튼을 사용할 수 있어요.</p><button class="btn" id="start">게임 시작</button></div></div></div>
<div class="below"><span>벽이나 자기 몸에 부딪히면 게임 종료</span><span><kbd>P</kbd> 일시정지</span></div><div class="controls" aria-label="방향 버튼"><button class="direction up" data-dir="up" aria-label="위">▲</button><button class="direction left" data-dir="left" aria-label="왼쪽">◀</button><button class="direction down" data-dir="down" aria-label="아래">▼</button><button class="direction right" data-dir="right" aria-label="오른쪽">▶</button></div></section><p class="foot">먹이를 먹을수록 뱀이 빨라집니다. 침착하게 방향을 바꾸세요!</p></main>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s),N=24,CELL=20;let snake,food,dir,nextDir,score,timer,playing=false,paused=false,muted=false,audio,best=Number(localStorage.getItem('snakeBest')||0);$('#best').textContent=best;
function sound(freq=440,duration=.09,wave='sine'){if(muted)return;audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type=wave;osc.frequency.setValueAtTime(freq,audio.currentTime);gain.gain.setValueAtTime(.07,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}
function reset(){snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];dir={x:1,y:0};nextDir={...dir};score=0;foodAtRandom();$('#score').textContent=score;$('#speed').textContent='1×';draw()}
$('.hud').insertAdjacentHTML('afterend','<div class="toolbar"><button class="tool" id="sound" aria-pressed="true">🔊 효과음 켜짐</button><button class="tool" id="restart">↻ 재시작</button></div>');
function foodAtRandom(){const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});food=free[Math.floor(Math.random()*free.length)]}
function start(){clearInterval(timer);reset();playing=true;paused=false;$('#overlay').hidden=true;schedule()}
function schedule(){clearInterval(timer);timer=setInterval(step,Math.max(68,145-Math.floor(score/5)*9))}
function step(){if(!playing||paused)return;dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eating=head.x===food.x&&head.y===food.y,body=eating?snake:snake.slice(0,-1);if(head.x<0||head.x>=N||head.y<0||head.y>=N||body.some(s=>s.x===head.x&&s.y===head.y)){end();return}snake.unshift(head);if(eating){score++;sound(660,.12);setTimeout(()=>sound(880,.15),65);$('#score').textContent=score;foodAtRandom();$('#speed').textContent=(1+Math.floor(score/5)*.25).toFixed(score>=5?2:0)+'×';if(score%5===0)schedule()}else snake.pop();draw()}
function end(){playing=false;clearInterval(timer);sound(125,.35,'sawtooth');setTimeout(()=>sound(82,.45,'sawtooth'),100);const record=score>best;if(record){best=score;localStorage.setItem('snakeBest',best);$('#best').textContent=best}$('#emoji').textContent=score>=15?'🏆':'💥';$('#title').textContent='게임 오버';$('#description').innerHTML=`점수 <b>${score}</b>점${record?' · 새로운 최고 기록!':''}<br>다시 도전해 볼까요?`;$('#start').textContent='다시 시작';$('#overlay').hidden=false}
function draw(){ctx.clearRect(0,0,480,480);ctx.fillStyle='#0b1712';ctx.fillRect(0,0,480,480);ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,480);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(480,i*CELL);ctx.stroke()}const pulse=.88+Math.sin(performance.now()/160)*.08,fx=(food.x+.5)*CELL,fy=(food.y+.5)*CELL;ctx.shadowColor='#ff7865';ctx.shadowBlur=17;ctx.fillStyle='#ff806c';ctx.beginPath();ctx.arc(fx,fy,7*pulse,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#9ee77d';ctx.beginPath();ctx.ellipse(fx+2,fy-9,4,2,-.5,0,Math.PI*2);ctx.fill();snake.forEach((s,i)=>{const pad=i?2:1,x=s.x*CELL+pad,y=s.y*CELL+pad,size=CELL-pad*2;ctx.fillStyle=i?'#53bb78':'#b0f184';ctx.shadowColor=i?'#38bf72':'#a5f16e';ctx.shadowBlur=i?4:10;ctx.beginPath();ctx.roundRect(x,y,size,size,i?5:7);ctx.fill();ctx.shadowBlur=0;if(!i){const ex=s.x*CELL+CELL/2+dir.x*4+dir.y*4,ey=s.y*CELL+CELL/2+dir.y*4+dir.x*4;const ex2=s.x*CELL+CELL/2+dir.x*4-dir.y*4,ey2=s.y*CELL+CELL/2+dir.y*4-dir.x*4;ctx.fillStyle='#173622';for(const [px,py] of [[ex,ey],[ex2,ey2]]){ctx.beginPath();ctx.arc(px,py,1.5,0,Math.PI*2);ctx.fill()}}})}
function turn(x,y){if(!playing||x===-dir.x&&y===-dir.y)return;if(x!==nextDir.x||y!==nextDir.y)sound(340,.035,'triangle');nextDir={x,y}}
const dirs={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};document.addEventListener('keydown',e=>{if(dirs[e.key]){e.preventDefault();turn(...dirs[e.key])}else if(e.key.toLowerCase()==='p'&&playing){paused=!paused;sound(paused?240:480,.12);if(paused){$('#emoji').textContent='⏸️';$('#title').textContent='잠시 멈춤';$('#description').textContent='P 키를 누르면 다시 이어집니다.';$('#start').textContent='계속하기';$('#overlay').hidden=false}else $('#overlay').hidden=true}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{const map={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};turn(...map[b.dataset.dir])}));$('#start').addEventListener('click',()=>paused?(paused=false,$('#overlay').hidden=true):start());$('#restart').addEventListener('click',start);$('#sound').addEventListener('click',()=>{muted=!muted;$('#sound').textContent=muted?'🔇 효과음 꺼짐':'🔊 효과음 켜짐';$('#sound').setAttribute('aria-pressed',String(!muted));if(!muted)sound(520,.1)});reset();
</script></body></html>
