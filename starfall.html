<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080c1c" />
  <title>Starfall: 보석 수집가</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0,#202c53,#0d1228 55%,#070a16);color:#f4f5ff;font-family:system-ui,-apple-system,sans-serif}main{width:min(100%,960px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 auto 14px;max-width:920px}.brand h1{margin:0;font-size:clamp(21px,4vw,32px);letter-spacing:-.04em}.brand p{margin:4px 0 0;color:#aab5d2;font-size:13px}a{color:#ffe18a;text-decoration:none;font-size:13px;white-space:nowrap}.game{position:relative;overflow:hidden;border:1px solid #ffe18a38;border-radius:18px;background:#080c1c;box-shadow:0 24px 80px #0009}.game canvas{display:block;width:100%;height:auto;touch-action:none}.help{display:flex;justify-content:center;flex-wrap:wrap;gap:7px 22px;margin:13px 0 0;color:#a2afcd;font-size:12px}.help b{color:#f3f6ff}.touch{display:none;justify-content:center;gap:14px;margin-top:12px}.touch button{width:78px;height:48px;border:1px solid #ffe18a55;border-radius:13px;background:#202746;color:#fff;font-size:21px;touch-action:none}@media(max-width:600px){body{padding:14px 9px}.help{gap:6px 12px;font-size:10px}.touch{display:flex}}
  </style>
</head>
<body>
  <main>
    <header><div class="brand"><h1>🌟 Starfall: 보석 수집가</h1><p>별빛을 모으고 운석을 피해 우주 최고 기록에 도전하세요</p></div><a href="./index.html">← 게임 목록</a></header>
    <div class="game"><canvas id="game" width="900" height="540" aria-label="Starfall game area"></canvas></div>
    <div class="touch" aria-label="Touch controls"><button id="left" aria-label="Move left">◀</button><button id="right" aria-label="Move right">▶</button></div>
    <p class="help"><span><b>← → / A D</b> 이동</span><span><b>수정</b> 수집 · <b>운석</b> 회피</span><span><b>P</b> 일시정지 · <b>M</b> 소리 · <b>R</b> 다시 시작</span></p>
  </main>
  <script type="module" src="/src/starfall.ts"></script>
</body>
</html>
