<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>NEON TETRIS</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 16px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 8%,#15243a 0,#080d18 48%,#03050a 100%);color:#e7f7ff;font-family:Inter,'Segoe UI',Arial,sans-serif}
main{width:min(760px,96vw);text-align:center}
header{margin-bottom:18px}
.eyebrow{margin:0 0 6px;color:#55e8ef;font-size:11px;font-weight:700;letter-spacing:.28em}
h1{margin:0;color:#f2fbff;font-size:clamp(24px,4vw,36px);letter-spacing:.12em;text-shadow:0 0 24px #00e5ff55}
.subtitle{margin:7px 0 0;color:#8ba5bd;font-size:13px;letter-spacing:.04em}
.gameFrame{display:flex;justify-content:center;align-items:stretch;gap:14px;padding:10px;border:1px solid #274058;border-radius:18px;background:linear-gradient(145deg,#101d2d,#09111e);box-shadow:0 24px 70px #0009,inset 0 1px #ffffff0b}
#game{display:block;width:min(60vw,240px);height:auto;aspect-ratio:1/2;border:1px solid #295169;border-radius:9px;background:#050a14;box-shadow:0 0 35px #00d9ff12;image-rendering:pixelated}
.panel{width:120px;display:flex;flex-direction:column;gap:9px;text-align:left}
.card{padding:11px;border:1px solid #1f344a;border-radius:11px;background:#07111e}
.label{display:block;margin-bottom:6px;color:#7f9bb4;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.value{color:#e5faff;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
#highScore{font-size:16px}
#next{display:block;width:80px;height:80px;margin:auto;background:#050a14;border:1px solid #1d354a;border-radius:7px}
.info{display:flex;justify-content:center;gap:8px 22px;flex-wrap:wrap;margin:14px 0 0;color:#9cb2c8;font-size:12px}
.info strong{color:#dffaff;font-weight:650}
#overlay{position:fixed;inset:0;background:#030812d9;backdrop-filter:blur(5px);color:#fff;display:none;align-items:center;justify-content:center;text-align:center;z-index:10;padding:20px}
#overlay>div{width:min(360px,100%);padding:30px;border:1px solid #28536b;border-radius:18px;background:linear-gradient(145deg,#102033,#07101d);box-shadow:0 24px 80px #000c}
#overlay h2{margin:0 0 14px;color:#ff758b;letter-spacing:.12em}
#overlay p{margin:7px 0;color:#9cb2c8}
#overlay strong{color:#e5faff}
.flash{animation:flash .25s ease-out}
@keyframes flash{from{background:rgba(255,255,255,.35)}to{background:rgba(0,0,0,0)}}
.level-up{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(1);color:#fff}50%{transform:scale(1.6);color:#ff0}100%{transform:scale(1);color:#fff}}
@media(max-width:520px){body{padding:16px 8px}.gameFrame{gap:8px;padding:6px;border-radius:13px}#game{width:min(62vw,240px)}.panel{width:min(27vw,100px);gap:6px}.card{padding:8px}.value{font-size:17px}#highScore{font-size:14px}#next{width:68px;height:68px}.info{gap:8px 14px;font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">ARCADE · 02</p>
    <h1>NEON TETRIS</h1>
    <p class="subtitle">완성된 줄을 지우고 최고 점수에 도전하세요</p>
  </header>
  <div class="gameFrame">
    <canvas id="game" width="240" height="480" aria-label="Tetris game board"></canvas>
    <aside class="panel" aria-label="Game statistics">
      <div class="card"><span class="label">Next</span><canvas id="next" width="80" height="80" aria-label="Next piece"></canvas></div>
      <div class="card"><span class="label">Score</span><div class="value" id="score">0</div></div>
      <div class="card"><span class="label">Best</span><div class="value" id="highScore">0</div></div>
      <div class="card"><span class="label">Level</span><div class="value" id="level">1</div></div>
    </aside>
  </div>
  <div class="info"><span><strong>← / →</strong> 이동</span><span><strong>↑</strong> 회전</span><span><strong>↓</strong> 빠르게 내리기</span><span><strong>SPACE</strong> 즉시 내리기 · 게임 오버 후 재시작</span><span><strong>B</strong> 음악 켜기/끄기</span></div>
</main>

<div id="overlay">
  <div>
    <h2>GAME OVER</h2>
    <p>Score: <strong id="finalScore"></strong></p>
    <p>Best: <strong id="finalHighScore"></strong></p>
    <p>Level: <strong id="finalLevel"></strong></p>
    <p style="margin-top:18px">Press <strong>SPACE</strong> to play again</p>
  </div>
</div>

<script>

/* ===== High Score ===== */
let bestScore = Number(localStorage.getItem("tetrisHighScore")) || 0;

/* ===== Sound ===== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtx();

function playSound(freq, duration = 0.08, type = "square", vol = 0.1) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.value = freq;

  gain.gain.value = vol;
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audioCtx.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playFunnyLineClearSound(lines) {
  const patterns = [
    [500, 900],                 // 1줄: 삐용
    [400, 800, 600],            // 2줄: 뿅뿅
    [350, 700, 1000, 600],      // 3줄: 퐁↗뽁
    [300, 600, 1200, 900, 600]  // 4줄: 보너스!
  ];

  const notes = patterns[Math.min(lines - 1, 3)];

  notes.forEach((freq, i) => {
    setTimeout(() => {
      playSound(
        freq,
        0.07,
        i % 2 === 0 ? "square" : "sawtooth",
        0.18
      );
    }, i * 60);
  });
}

function playLevelUpSound() {
  const notes = [600, 900, 1200];
  notes.forEach((freq, i) => {
    setTimeout(() => {
      playSound(freq, 0.12, "triangle", 0.25);
    }, i * 120);
  });
}

/* ===== BGM ===== */
let bgmInterval = null;
let bgmOn = true;

const bgmNotes = [
  262, 330, 392, 330,   // C E G E
  294, 349, 415, 349,   // D F# G# F#
  262, 330, 392, 440,   // C E G A
  392, 330, 294, 262    // G E D C
];

function playBgmNote(freq, duration = 0.25) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "square";
  osc.frequency.value = freq;

  gain.gain.value = 0.05;
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audioCtx.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function startBGM() {
  if (!bgmOn || bgmInterval) return;

  let index = 0;
  bgmInterval = setInterval(() => {
    playBgmNote(bgmNotes[index]);
    index = (index + 1) % bgmNotes.length;
  }, 250);
}

function stopBGM() {
  clearInterval(bgmInterval);
  bgmInterval = null;
}


/* ===== Canvas ===== */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
ctx.scale(20,20);

const nextCanvas=document.getElementById("next");
const nextCtx=nextCanvas.getContext("2d");
nextCtx.scale(20,20);

/* ===== Constants ===== */
const COLS=12, ROWS=24;
const colors=[null,"#0ff","#00f","#fa0","#ff0","#0f0","#a0f","#f00"];

/* ===== Helpers ===== */
const createMatrix=(w,h)=>Array.from({length:h},()=>Array(w).fill(0));

const createPiece=t=>({
  I:[[1,1,1,1]],
  J:[[2,0,0],[2,2,2]],
  L:[[0,0,3],[3,3,3]],
  O:[[4,4],[4,4]],
  S:[[0,5,5],[5,5,0]],
  T:[[0,6,0],[6,6,6]],
  Z:[[7,7,0],[0,7,7]]
}[t]);

function rotateMatrixCCW(matrix) {
  const h = matrix.length;
  const w = matrix[0].length;
  const result = Array.from({ length: w },
    () => Array(h).fill(0)
  );

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      result[w - 1 - x][y] = matrix[y][x];
    }
  }
  return result;
}

/* ===== Game State ===== */
let arena,gameOver;

const player={
  pos:{x:0,y:0},
  matrix:null,next:null,
  score:0,lines:0,level:1
};

/* ===== Collision ===== */
function collide(a,p){
  for(let y=0;y<p.matrix.length;y++)
    for(let x=0;x<p.matrix[y].length;x++)
      if(p.matrix[y][x] &&
        (a[y+p.pos.y]?.[x+p.pos.x])!==0)
        return true;
  return false;
}

/* ===== Safe Move ===== */
function movePlayer(dir){
  player.pos.x += dir;
  if(collide(arena, player)){
    player.pos.x -= dir;
  } else {
    playSound(600, 0.05);
  }
}

/* ===== Merge & Sweep ===== */
function merge(a,p){
  p.matrix.forEach((r,y)=>r.forEach((v,x)=>{
    if(v)a[y+p.pos.y][x+p.pos.x]=v;
  }));
}

function sweep(){
  let cleared=0;
  outer:for(let y=ROWS-1;y>=0;y--){
    for(let x=0;x<COLS;x++) if(!arena[y][x]) continue outer;
    arena.splice(y,1);
    arena.unshift(Array(COLS).fill(0));
    cleared++; y++;
  }
  if(cleared){
    playFunnyLineClearSound(cleared);

    player.lines+=cleared;
    player.score+=[0,100,300,500,800][cleared]*player.level;
    if(player.lines>=player.level*10){
      player.level++;
      dropInterval=Math.max(100,800-100*(player.level-1));

      // 🎉 LEVEL UP EFFECT
      playLevelUpSound();
      flashScreen();
      animateLevel();
    }
    updateUI();
  }
}

/* ===== Rotation ===== */
function rotatePlayer(){
  const oldMatrix = player.matrix;
  const oldX = player.pos.x;

  player.matrix = rotateMatrixCCW(oldMatrix);

  let offset = 1;
  while (collide(arena, player)) {
    player.pos.x += offset;
    offset = -(offset + (offset > 0 ? 1 : -1));
    if (Math.abs(offset) > player.matrix[0].length) {
      player.matrix = oldMatrix;
      player.pos.x = oldX;
      return;
    }
  }

  // 회전 성공 사운드
  playSound(750, 0.06, "triangle");
}

/* ===== Drop ===== */
function drop(){
  player.pos.y++;
  if(collide(arena, player)){
    player.pos.y--;
    merge(arena, player);
    sweep();
    resetPlayer();
    playSound(120, 0.12, "sawtooth");
  } else {
    playSound(300, 0.03, "square", 0.05);
  }
  dropCounter = 0;
}

function hardDrop(){
  while(!collide(arena, player)){
    player.pos.y++;
    player.score += 2;
  }
  player.pos.y--;
  merge(arena, player);
  sweep();
  resetPlayer();
  playSound(90, 0.18, "sawtooth", 0.15);
  updateUI();
}

/* ===== Player Reset ===== */
const randomPiece=()=>{
  const p="TJLOSZI";
  return createPiece(p[Math.random()*p.length|0]);
};

function resetPlayer(){
  if(!player.next) player.next=randomPiece();
  player.matrix=player.next;
  player.next=randomPiece();
  player.pos.y=0;
  player.pos.x=(COLS/2|0)-(player.matrix[0].length/2|0);
  drawNext();

  if(collide(arena,player)){
    endGame();
  }
}

/* ===== Draw ===== */
function drawMatrix(m,o,c){
  m.forEach((r,y)=>r.forEach((v,x)=>{
    if(v){
      c.fillStyle=colors[v];
      c.fillRect(x+o.x,y+o.y,1,1);
    }
  }));
}

function draw(){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#0a1220";
  ctx.fillRect(0,0,COLS,ROWS);
  ctx.strokeStyle="rgba(38,52,74,0.62)";
  ctx.lineWidth=0.05;
  for(let x=1;x<COLS;x++){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,ROWS);
    ctx.stroke();
  }
  for(let y=1;y<ROWS;y++){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(COLS,y);
    ctx.stroke();
  }
  drawMatrix(arena,{x:0,y:0},ctx);
  drawMatrix(player.matrix,player.pos,ctx);
}

function drawNext(){
  nextCtx.fillStyle="#000";
  nextCtx.fillRect(0,0,4,4);
  drawMatrix(player.next,{x:1,y:1},nextCtx);
}

function updateUI(){
  score.textContent=player.score;
  level.textContent=player.level;
  document.getElementById("highScore").textContent = bestScore;
}

/* ===== Game Over ===== */
function endGame(){
  gameOver = true;
  stopBGM();

  if (player.score > bestScore) {
    bestScore = player.score;
    localStorage.setItem("tetrisHighScore", bestScore);

    playSound(1200, 0.25, "triangle", 0.3);

    const hs = document.getElementById("highScore");
    hs.style.color = "#ff0";
    setTimeout(() => hs.style.color = "#fff", 500);
  }

  updateUI();

  finalScore.textContent = player.score;
  finalLevel.textContent = player.level;
  finalHighScore.textContent = bestScore;

  overlay.style.display = "flex";
  playSound(60, 0.5, "sine", 0.2);
}

/* ====== Level Up effect ===== */
function flashScreen() {
  const f = document.createElement("div");
  f.style.position = "fixed";
  f.style.inset = 0;
  f.style.pointerEvents = "none";
  f.style.background = "rgba(255,255,255,0.35)";
  f.className = "flash";
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 250);
}

function animateLevel() {
  const el = document.getElementById("level");
  el.classList.remove("level-up"); // 리셋
  void el.offsetWidth;             // reflow
  el.classList.add("level-up");
}


/* ===== Loop ===== */
let dropCounter=0,dropInterval=800,lastTime=0;
function update(t=0){
  if(gameOver) return;
  const d=t-lastTime; lastTime=t;
  dropCounter+=d;
  if(dropCounter>dropInterval) drop();
  draw();
  requestAnimationFrame(update);
}

/* ===== Input ===== */
document.addEventListener("keydown",e=>{
  if (["ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", " "].includes(e.key)) e.preventDefault();
  if(gameOver){
    if(e.code==="Space") startGame();
    return;
  }

  if (e.key === "b" || e.key === "B") {
    bgmOn = !bgmOn;
    if (bgmOn) startBGM();
    else stopBGM();
  }

  if(e.key==="ArrowLeft") movePlayer(-1);
  if(e.key==="ArrowRight") movePlayer(1);
  if(e.key==="ArrowDown") drop();
  if(e.key==="ArrowUp") rotatePlayer();
  if(e.code==="Space") hardDrop();
});

/* ===== Start / Restart ===== */
function startGame(){
  arena=createMatrix(COLS,ROWS);
  player.score=0;player.lines=0;player.level=1;
  player.next=null;
  gameOver=false;
  overlay.style.display="none";
  dropCounter=0;lastTime=0;dropInterval=800;
  resetPlayer();
  updateUI();
  update();
  startBGM();

}

startGame();
</script>
</body>
</html>
