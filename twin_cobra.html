<!doctype html>
<html lang="ko">

</head>
<body>
  <main>
    <h1>TWIN COBRA</h1>
    <canvas id="game" width="540" height="900" aria-label="Twin Cobra 스타일 세로 슈팅 게임"></canvas>
    <p>이동: 방향키 / WASD · 발사: Space 또는 터치 · 폭탄: X / 화면 버튼 · 일시정지: P · 음소거: M<br>W 아이템으로 무기 변경 · B 폭탄 보충 · 20,000점마다 추가 목숨 · 클리어 시 잔여 목숨당 10,000점<br><a href="./index.html">게임 목록</a></p>
  </main>
  <script>
    const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height, keys = new Set();
    function makeSprite(rows,palette){const c=document.createElement('canvas'),w=Math.max(...rows.map(r=>r.length));c.width=w;c.height=rows.length;const g=c.getContext('2d');for(let y=0;y<rows.length;y++)for(let x=0;x<rows[y].length;x++){const color=palette[rows[y][x]];if(color){g.fillStyle=color;g.fillRect(x,y,1,1);}}return c;}
    const heliSprite=makeSprite([
      '.......DDD.......','......DDDDD......','.....DDWWWDD.....','...SSDDWWWDDSS...','..SSSDDDDDDDSSS..','.SSSDDDDDDDDDSSS.','.SSDDDDDDDDDDDSS.','..SDDDDDDDDDDDS..','...DDDDDDDDD.....','....DDDDDDD......','.....DDDDD.......','......DDD........','......DDD........','......DDD........','....SSDDDSS......','...SS..D..SS......','.......D..........','.......D..........','......DDD.........','.....DDDDD........','....DDDDDDD.......'
    ],{D:'#a74435',W:'#8dc5bc',S:'#343b34'});
    const enemyHeliSprite=makeSprite([
      '.......DDD.......','......DDDDD......','.....DDWWWDD.....','...SSDDWWWDDSS...','..SSSDDDDDDDSSS..','.SSSDDDDDDDDDSSS.','.SSDDDDDDDDDDDSS.','..SDDDDDDDDDDDS..','...DDDDDDDDD.....','....DDDDDDD......','.....DDDDD.......','......DDD........','......DDD........','......DDD........','....SSDDDSS......','...SS..D..SS......','.......D..........','.......D..........','......DDD.........','.....DDDDD........','....DDDDDDD.......'
    ],{D:'#71805b',W:'#9db4aa',S:'#30382d'});
    const tileCanvases=Array.from({length:7},(_,i)=>{const c=document.createElement('canvas');c.width=c.height=24;const g=c.getContext('2d'),colors=['#55563a','#52613b','#675b3c','#4c5043','#354e59','#4c5848','#343748'];g.fillStyle=colors[i];g.fillRect(0,0,24,24);for(let n=0;n<34;n++){const x=(n*17+i*7)%24,y=(n*11+i*13)%24;g.fillStyle=n%3?'rgba(205,193,132,.12)':'rgba(15,21,16,.15)';g.fillRect(x,y,n%5===0?3:1,n%7===0?3:1);}return c;});
    const airshipSprite=(()=>{const c=document.createElement('canvas');c.width=84;c.height=44;const g=c.getContext('2d');for(let y=5;y<34;y++){const half=y<10?18+y*2:y<25?38:Math.max(12,38-(y-25)*4);g.fillStyle='#1d2431';g.fillRect(42-half,y,half*2,1);g.fillStyle=y<13?'#aab3bf':y<24?'#68748a':'#40495c';g.fillRect(42-half+2,y+1,half*2-4,1);}g.fillStyle='#c3c9cf';g.fillRect(21,11,42,2);g.fillStyle='#903947';g.fillRect(14,16,56,3);g.fillStyle='#cbb85f';g.fillRect(20,17,4,2);g.fillRect(60,17,4,2);g.fillStyle='#354054';g.fillRect(30,20,24,17);g.fillStyle='#8997a7';g.fillRect(33,21,18,3);g.fillStyle='#93c9ca';g.fillRect(35,24,14,5);g.fillStyle='#263142';g.fillRect(34,30,16,5);for(let x=37;x<48;x+=3){g.fillStyle=x%2?'#e5ce75':'#a1f0e5';g.fillRect(x,24,2,3);}for(const x of [15,18,66,69]){g.fillStyle='#efd77e';g.fillRect(x,28,2,3);}g.fillStyle='#9ea8b5';g.fillRect(11,8,11,3);g.fillRect(62,8,11,3);g.fillStyle='#b6bfca';g.fillRect(7,9,5,2);g.fillRect(72,9,5,2);g.fillStyle='#d4b955';g.fillRect(39,35,6,7);g.fillStyle='#9c3640';g.fillRect(41,40,2,4);return c;})();
    let score = 0, lives = 3, state = 'title', frame = 0, bullets = [], shots = [], enemies = [], blasts = [], terrain = [], pickups = [], wave = 0, pending = [], weapon = 1, weaponType = 0, lastLaserFrame = -100, bombs = 3, kills = 0, bombFlash = 0, nextExtraLife = 20000, clearLifeBonus = 0, muted = false, banner = 0;
    const bestKey = 'twinCobraBest';
    let best = Number(localStorage.getItem(bestKey) || 0);
    let audio, musicTimer, musicStep = 0, lastShotSound = 0;
    const melody = [0,7,12,7, 3,10,15,10, 5,12,17,12, 3,10,15,10];
    function tone(freq, duration, type='square', volume=.035, slide=0) {

    }
    function sfx(name) {

      if(name==='pickup'){tone(660,.09,'square');setTimeout(()=>tone(990,.13,'square'),75);}
      if(name==='bomb'){tone(100,.5,'sawtooth',.09,900);setTimeout(()=>tone(420,.3,'triangle',.06,-300),90);}

    const player = { x: W / 2, y: H - 90, r: 13, speed: 4.2, inv: 0 };

      { at: 1710, name: '3구역 · 협곡 매복', type: 'cross' },
      { at: 2520, name: '4구역 · 교량 방어선', type: 'fortress' },
      { at: 3330, name: '5구역 · 적 공군', type: 'air' },
      { at: 4140, name: '6구역 · 사령부 접근', type: 'mixed' },
      { at: 4950, name: '7구역 · 레이더 기지', type: 'fortress' },
      { at: 5760, name: '8구역 · 철도 호송대', type: 'tank' },
      { at: 6570, name: '9구역 · 공습 경보', type: 'air' },
      { at: 7380, name: '10구역 · 요새 외곽', type: 'mixed' },
      { at: 8190, name: '11구역 · 최종 방어선', type: 'cross' },
      { at: 9000, name: '최종 구역 · 공중 요새', type: 'boss' },
    ];
    function reset() { score = 0; lives = 3; state = 'playing'; frame = 0; wave = 0; pending = []; bullets = []; shots = []; enemies = []; blasts = []; pickups = []; weapon = 1; weaponType = 0; lastLaserFrame = -100; bombs = 3; kills = 0; bombFlash = 0; nextExtraLife = 20000; clearLifeBonus = 0; banner = 120; player.x = W / 2; player.y = H - 90; player.inv = 100; }
    for (let i = 0; i < 70; i++) terrain.push({ x: Math.random() * W, y: Math.random() * H, type: Math.random() < .14 ? 1 : 0, size: 3 + Math.random() * 12 });
    document.addEventListener('keydown', e => { const key=e.key.toLowerCase(); keys.add(key); if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) e.preventDefault(); if ((state==='title'||state==='gameover'||state==='cleared') && (e.key === ' ' || e.key === 'Enter')) {reset();startAudio();} else startAudio(); if(key==='p'&& (state==='playing'||state==='paused'))state=state==='playing'?'paused':'playing';if(key==='m')muted=!muted; if (state==='playing' && (key==='x'||key==='b')) useBomb(); });

    canvas.addEventListener('pointerdown', e => { startAudio(); canvas.setPointerCapture(e.pointerId); const p=point(e);if(p.x>W-78&&p.y<42){muted=!muted;return;}if(p.x<65&&p.y<42){if(state==='playing')state='paused';else if(state==='paused')state='playing';return;}if(state==='title'||state==='gameover'||state==='cleared'){reset();pointer=p;keys.add(' ');return;}if(p.x>W-82&&p.y>H-66){useBomb();return;}if(state==='paused'){state='playing';return;}pointer = p; keys.add(' '); });
    canvas.addEventListener('pointermove', e => { if (pointer) pointer = point(e); });
    canvas.addEventListener('pointerup', () => { pointer = null; keys.delete(' '); });
    function point(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX-r.left)*W/r.width, y: (e.clientY-r.top)*H/r.height }; }
    function useBomb() { if(bombs<=0||state!=='playing')return; bombs--; bullets=[]; bombFlash=18;sfx('bomb'); for(const e of enemies){e.hp-=e.boss?8:3;if(e.hp<=0){e.dead=true;score+=e.boss?1000:e.ground?800:e.tank?300:100;blasts.push({x:e.x,y:e.y,t:18});}} enemies=enemies.filter(e=>!e.dead); }
    function damageEnemy(e, amount) {
      e.hp-=amount;
      if(e.hp>0)return;
      e.dead=true;score+=e.boss?5000:e.ground?800:e.tank?300:100;blasts.push({x:e.x,y:e.y,t:16});sfx('hit');

    }
    function heli(x,y,scale,color) {
      ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(10,15,12,.38)';ctx.beginPath();ctx.ellipse(3*scale,5*scale,15*scale,20*scale,0,0,Math.PI*2);ctx.fill();ctx.imageSmoothingEnabled=false;ctx.drawImage(color==='#a94435'?heliSprite:enemyHeliSprite,-9.5*scale,-10.5*scale,19*scale,22*scale);
      ctx.fillStyle='#252a22';ctx.fillRect(-21*scale,-2*scale,42*scale,3*scale);ctx.fillStyle='#d6d0aa';const rotor=frame%8<4;ctx.fillRect(-(rotor?30:2)*scale,-(rotor?2:23)*scale,(rotor?60:4)*scale,3*scale);ctx.fillRect(-2*scale,-4*scale,4*scale,7*scale);ctx.restore();
    }
    function airship(x,y,hp,maxHp) {
      ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(9,12,18,.42)';ctx.fillRect(-82,17,164,31);ctx.imageSmoothingEnabled=false;ctx.drawImage(airshipSprite,x-82,y-40,164,80);
      for(const side of [-1,1]){ctx.fillStyle='#212837';ctx.fillRect(side*61-2,-30,4,20);ctx.fillStyle='#c6ccd0';if(frame%8<4)ctx.fillRect(side*74-14,-31,28,3);else ctx.fillRect(side*61-2,-42,4,26);}
      ctx.fillStyle='#421d25';ctx.fillRect(-46,-47,92,6);ctx.fillStyle='#ed4f49';ctx.fillRect(-46,-47,92*Math.max(0,hp/maxHp),6);ctx.restore();
    }
    function spawnEnemy(kind) {
      const tank = kind === 'tank' || (kind !== 'scout' && Math.random() < .55);
      const x = 30 + Math.random() * (W - 60);
      enemies.push({ x, y: -25, hp: tank ? 2 : 1, tank, role: kind, vy: tank ? 1.1 : 1.8, phase: Math.random() * 6 });
    }
    function queueEnemy(kind, delay) { pending.push({ kind, at: frame + delay }); }
    function spawnWave(index) {
      const type = waves[index].type;
      if (type === 'scout') { for (let i=0;i<8;i++) queueEnemy(i%2?'zigzag':'scout', i*23); }
      if (type === 'air') { for (let i=0;i<10;i++) queueEnemy(i%2?'swoop':'zigzag', i*22); }
      if (type === 'tank') { for (let i=0;i<7;i++) queueEnemy('tank', i*32); }
      if (type === 'cross' || type === 'mixed') { for (let i=0;i<12;i++) queueEnemy(['swoop','tank','zigzag','scout'][i%4], i*21); }
      if (type === 'fortress') {
        for (const x of [90, W/2, W-90]) enemies.push({x,y:-35,hp:5,tank:true,ground:true,vy:1.05,phase:0});
        for (let i=0;i<7;i++) queueEnemy(i%2?'tank':'scout', i*25);
      }
      if (type === 'boss') { banner=210; enemies.push({x:W/2,y:-120,hp:80,maxHp:80,tank:true,boss:true,vy:.65,phase:0});for(let i=0;i<6;i++)queueEnemy(i%2?'zigzag':'tank',90+i*35); }
    }
    function update() {
      if (state === 'playing') {
        frame++;
        if (wave < waves.length && frame >= waves[wave].at) { spawnWave(wave); wave++; banner=110; }
        for (const queued of pending) if (queued.at <= frame && !queued.spawned) { spawnEnemy(queued.kind); queued.spawned = true; }
        pending = pending.filter(queued => !queued.spawned);
        for (const t of terrain) { t.y += 2.4; if (t.y>H+12) { t.y=-10; t.x=Math.random()*W; } }
        pickups.forEach(p=>p.y+=1.5); pickups=pickups.filter(p=>p.y<H+10);
        if (pointer) { player.x += (pointer.x-player.x)*.16; player.y += (pointer.y-player.y)*.16; }
        else { player.x += ((keys.has('arrowright')||keys.has('d'))-(keys.has('arrowleft')||keys.has('a')))*player.speed; player.y += ((keys.has('arrowdown')||keys.has('s'))-(keys.has('arrowup')||keys.has('w')))*player.speed; }

        if(shooting&&weaponType===1&&frame-lastLaserFrame>=31){shots.push({x:player.x,y:player.y-82,vx:0,vy:14,type:1,damage:2+weapon,length:68+weapon*12});lastLaserFrame=frame;sfx('laser');}

        }
        if (wave > 0 && wave < waves.length && frame % 210 === 0) spawnEnemy(['scout','zigzag','tank','swoop'][Math.floor(Math.random()*4)]);

        enemies.forEach(e=>{
          if(e.boss){if(e.y<150)e.y+=e.vy;else e.y=150+Math.sin(frame/55)*14;e.x+=Math.sin(frame/42)*2.5;
            if(frame%78===0&&e.y>20){const phase=Math.floor(frame/240)%3;if(phase===0){for(const dx of [-1.8,-.9,0,.9,1.8])bullets.push({x:e.x,y:e.y+18,v:2.4,dx});}else if(phase===1){const aim=Math.max(-2.2,Math.min(2.2,(player.x-e.x)/130));for(const dx of [-.6,0,.6])bullets.push({x:e.x,y:e.y+18,v:2.7,dx:dx+aim});}else for(const dx of [-2.4,2.4])bullets.push({x:e.x,y:e.y+18,v:2.5,dx});}
          }else{
            e.y+=e.vy;
            if(e.role==='zigzag')e.x+=Math.sin(frame/13+e.phase)*2.4;
            else if(e.role==='swoop'){e.x+=Math.sin(frame/17+e.phase)*2.1;if(e.y>35&&frame%5===0)e.x+=(player.x>e.x?1:-1)*.45;}
            else e.x+=Math.sin(frame/45+e.phase)*.45;
            if(frame% (e.role==='swoop'?62:78)===0&&e.y>20){const dx=e.role==='swoop'?Math.max(-1.5,Math.min(1.5,(player.x-e.x)/150)):0;bullets.push({x:e.x,y:e.y+10,v:e.role==='swoop'?2.5:2.1,dx});}
          }
        });
        bullets.forEach(b=>{b.y+=b.v;b.x+=b.dx||0;}); bullets=bullets.filter(b=>b.y<H+10&&b.x>-10&&b.x<W+10);

        pickups=pickups.filter(p=>!p.got);

      }

    }
    function draw() {
      const route=[0,1,2,3,4,5,6,2,5,1,3,6],zone=route[Math.min(wave,route.length-1)],palettes=[['#55563a','#686747','#34372a'],['#52613b','#7d8b52','#303d29'],['#675b3c','#86724a','#403a2d'],['#4c5043','#787763','#292f2a'],['#354e59','#64817d','#263439'],['#4c5848','#657454','#30372c'],['#343748','#5e6176','#232633']];

      }else if(zone===3){
        ctx.fillStyle='#292d27';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(100,0);ctx.lineTo(136,H);ctx.lineTo(0,H);ctx.fill();ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W-76,0);ctx.lineTo(W-118,H);ctx.lineTo(W,H);ctx.fill();
        for(let y=(frame*2%150)-40;y<H;y+=150){ctx.fillStyle='#9a8050';ctx.fillRect(10+(y%3)*8,y,75,9);ctx.fillRect(W-87,y+62,78,11);ctx.fillStyle='#353a33';ctx.fillRect(26,y+20,40,15);}
      }else if(zone===4){
        const bank=132+Math.sin(frame/140)*26;ctx.fillStyle='#272e28';ctx.fillRect(0,0,bank,H);ctx.fillRect(bank+112,0,W-bank-112,H);
        const river=ctx.createLinearGradient(bank,0,bank+112,0);river.addColorStop(0,'#4e7779');river.addColorStop(.45,'#76a6a0');river.addColorStop(1,'#355d67');ctx.fillStyle=river;ctx.fillRect(bank,0,112,H);
        for(let y=(frame*2%170)-30;y<H;y+=170){ctx.fillStyle='rgba(189,220,194,.4)';ctx.fillRect(bank+18,y,36,3);ctx.fillRect(bank+68,y+38,28,2);}
        const bridgeY=(frame*1.1%380)-70;ctx.fillStyle='#373b3b';ctx.fillRect(0,bridgeY, W,35);ctx.fillStyle='#a98c5d';ctx.fillRect(0,bridgeY,W,8);ctx.fillStyle='#75684b';for(let x=0;x<W;x+=32)ctx.fillRect(x,bridgeY+10,20,18);
      }else if(zone===6){
        ctx.fillStyle='#252a34';ctx.fillRect(24,0,18,H);ctx.fillRect(W-42,0,18,H);ctx.fillStyle='#87909a';for(let y=(frame*2%92)-30;y<H;y+=92){ctx.fillRect(32,y,3,34);ctx.fillRect(W-39,y,3,34);}
        for(let y=(frame*1.7%240)-65;y<H;y+=240){ctx.fillStyle='#515764';ctx.fillRect(W*.68,y,76,52);ctx.fillStyle='#737a84';ctx.fillRect(W*.68+7,y+6,62,40);ctx.fillStyle='#252a31';ctx.fillRect(W*.68+26,y+15,24,22);}
      }else{
        for(let y=(frame*2%190)-80;y<H;y+=190){const x=(Math.floor(y/190)%2)*235+35;ctx.fillStyle='rgba(18,20,17,.42)';ctx.fillRect(x+4,y+6,58,52);ctx.fillStyle='#4b514c';ctx.fillRect(x,y,58,52);ctx.fillStyle='#8b8b78';ctx.fillRect(x+3,y+3,52,44);ctx.fillStyle='#62685f';ctx.fillRect(x+7,y+7,44,36);ctx.fillStyle='#252a27';ctx.fillRect(x+13,y+13,32,24);ctx.fillStyle='#a4a28e';ctx.fillRect(x+13,y+11,32,3);ctx.fillRect(x+11,y+13,3,24);for(const [bx,by] of [[5,5],[49,5],[5,38],[49,38]]){ctx.fillStyle='#343a36';ctx.fillRect(x+bx,y+by,3,3);ctx.fillStyle='#c0b99c';ctx.fillRect(x+bx,y+by,1,1);}}
      }
      for(const s of shots){
        if(s.type===1){ctx.save();ctx.shadowColor='#30eaff';ctx.shadowBlur=16;const beam=ctx.createLinearGradient(s.x,s.y,s.x,s.y+s.length);beam.addColorStop(0,'#ffffff');beam.addColorStop(.18,'#b9fbff');beam.addColorStop(.62,'#35dafa');beam.addColorStop(1,'rgba(20,150,255,.08)');ctx.fillStyle='rgba(18,185,236,.38)';ctx.fillRect(s.x-7,s.y,14,s.length);ctx.fillStyle=beam;ctx.fillRect(s.x-3,s.y,6,s.length);ctx.fillStyle='#f5ffff';ctx.fillRect(s.x-1,s.y,2,s.length*.68);ctx.fillStyle='#e7ffff';ctx.beginPath();ctx.moveTo(s.x,s.y-9);ctx.lineTo(s.x+5,s.y+2);ctx.lineTo(s.x,s.y+8);ctx.lineTo(s.x-5,s.y+2);ctx.closePath();ctx.fill();ctx.restore();}
        else{ctx.fillStyle=s.type===2?'#ff9e43':'#ffd84d';ctx.fillRect(s.x-3,s.y-7,6,12);}
      }
      for(const p of pickups){ctx.fillStyle=p.type==='weapon'?'#68e8ff':'#ffad42';ctx.beginPath();ctx.arc(p.x,p.y,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17201a';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText(p.type==='weapon'?'W':'B',p.x,p.y+4);}
      for(const e of enemies){if(e.boss)airship(e.x,e.y,e.hp,e.maxHp);else if(e.ground){ctx.fillStyle='#393a32';ctx.fillRect(e.x-20,e.y-13,40,28);ctx.fillStyle='#a69c76';ctx.fillRect(e.x-15,e.y-9,30,18);ctx.fillStyle='#21231e';ctx.fillRect(e.x-5,e.y-5,10,10);}else heli(e.x,e.y,e.tank?1.05:.8,e.tank?'#807d65':'#687a68');}
      ctx.fillStyle='#ff9d35';for(const b of bullets)ctx.fillRect(b.x-4,b.y-4,8,8);
      for(const b of blasts){const age=18-b.t,alpha=Math.max(0,b.t/18);ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle='#ffe18a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,Math.max(2,age*1.35),0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ff7b35';ctx.beginPath();ctx.arc(b.x,b.y,Math.max(2,age*.8),0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff1bb';ctx.beginPath();ctx.arc(b.x,b.y,Math.max(1,age*.32),0,Math.PI*2);ctx.fill();for(let i=0;i<8;i++){const a=i*Math.PI/4+age*.04,r=age*1.9;ctx.fillStyle=i%2?'#ffb347':'#fff0a8';ctx.fillRect(b.x+Math.cos(a)*r-2,b.y+Math.sin(a)*r-2,4,4);}ctx.restore();}
      if(player.inv===0||Math.floor(player.inv/6)%2===0)heli(player.x,player.y,1.15,'#a94435');
      ctx.fillStyle='#eee4ba';ctx.font='bold 16px monospace';ctx.textAlign='left';ctx.fillText(`1P ${String(score).padStart(7,'0')}`,12,24);ctx.textAlign='center';ctx.fillStyle='#54d86d';ctx.fillText('HIGH SCORE',W/2,24);ctx.fillStyle='#eee4ba';ctx.fillText(String(best).padStart(7,'0'),W/2,43);ctx.textAlign='right';ctx.fillText(`♥ ${lives}`,W-12,24);
      ctx.textAlign='center';ctx.font='bold 13px monospace';ctx.fillStyle='#eee4ba';ctx.fillText(waves[Math.max(0,wave-1)]?.name || '작전 개시',W/2,62);
      ctx.textAlign='left';ctx.font='bold 13px monospace';ctx.fillStyle='#7eeaff';ctx.fillText(`${['SPREAD','LASER','HOMING'][weaponType]} ${'★'.repeat(weapon)}`,12,82);ctx.textAlign='right';ctx.fillStyle='#ffca5a';ctx.fillText(`BOMB ${bombs} [X]`,W-12,82);
      ctx.fillStyle='#9d392c';ctx.fillRect(W-72,H-54,62,42);ctx.strokeStyle='#ffd16a';ctx.strokeRect(W-72,H-54,62,42);ctx.textAlign='center';ctx.fillStyle='#fff1bc';ctx.font='bold 12px monospace';ctx.fillText('BOMB',W-41,H-28);
      ctx.fillStyle='#333';ctx.fillRect(8,8,48,27);ctx.fillStyle='#eee4ba';ctx.textAlign='center';ctx.font='bold 11px monospace';ctx.fillText(state==='paused'?'RESUME':'PAUSE',32,26);ctx.fillStyle='#333';ctx.fillRect(W-60,8,52,27);ctx.fillStyle='#eee4ba';ctx.fillText(muted?'MUTE':'SOUND',W-34,26);
      if(banner>0&&state==='playing'){ctx.fillStyle=`rgba(0,0,0,${Math.min(.72,banner/100)})`;ctx.fillRect(30,H*.43,W-60,62);ctx.textAlign='center';ctx.fillStyle='#ffdf72';ctx.font='bold 18px monospace';ctx.fillText(waves[Math.max(0,wave-1)]?.name||'작전 개시',W/2,H*.43+27);if(wave===waves.length)ctx.fillStyle='#ff795e',ctx.fillText('WARNING: BOSS',W/2,H*.43+50);banner--;}
      if(bombFlash>0){ctx.fillStyle=`rgba(255,240,170,${bombFlash/28})`;ctx.fillRect(0,0,W,H);}
      if(state==='title'||state==='paused'){ctx.fillStyle='rgba(0,0,0,.76)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#f3d65c';ctx.font='bold 30px monospace';ctx.fillText(state==='title'?'TWIN COBRA':'PAUSED',W/2,H/2-24);ctx.fillStyle='#fff';ctx.font='15px monospace';ctx.fillText(state==='title'?'Space / 화면을 터치해 출격':'P 또는 PAUSE 버튼으로 계속',W/2,H/2+18);}
      if(state==='gameover'||state==='cleared'){ctx.fillStyle='rgba(0,0,0,.76)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#f3d65c';ctx.font='bold 30px monospace';ctx.fillText(state==='cleared'?'MISSION CLEAR':'GAME OVER',W/2,H/2-28);ctx.font='16px monospace';ctx.fillStyle='#fff';ctx.fillText(state==='cleared'?`점수 ${score} · 작전 완료`:'SPACE 또는 화면 터치로 다시 시작',W/2,H/2+5);if(state==='cleared'){ctx.fillText(`잔여 목숨 보너스 +${clearLifeBonus}`,W/2,H/2+30);ctx.fillText('Space / 터치로 다시 플레이',W/2,H/2+56);}}
    }
    update();
  </script>
